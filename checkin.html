<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>師大影像藝術創作社 · 社課簽到</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --fg:#0a0a0a; --muted:#6b6b6b; --line:#e8e8e8;
    --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; --blue:#2b4a9e;
    --radius:16px; --shadow:0 4px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; font-family:'Space Grotesk','PingFang TC',sans-serif; background:var(--bg); color:var(--fg);}
  .wrap{min-height:100%; max-width:420px; margin:0 auto; padding:24px 20px 40px; display:flex; flex-direction:column;}
  header{margin-bottom:28px;}
  h1{font-size:22px; font-weight:600; margin:0 0 6px; letter-spacing:-.02em;}
  .subtitle{color:var(--muted); font-size:14px; line-height:1.5;}
  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:16px;}
  label{display:block; font-size:13px; font-weight:500; margin-bottom:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  input{width:100%; padding:14px 16px; font-size:17px; border:1.5px solid var(--line); border-radius:12px; outline:none; font-family:inherit; transition:border-color .15s;}
  input:focus{border-color:var(--fg);}
  .btn{width:100%; padding:16px; font-size:17px; font-weight:600; border:none; border-radius:12px; background:var(--fg); color:#fff; cursor:pointer; margin-top:12px; transition:transform .1s, opacity .15s;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.secondary{background:#fff; color:var(--fg); border:1.5px solid var(--line);}
  .result{display:none;}
  .result.show{display:block;}
  .status{display:flex; align-items:center; gap:10px; font-size:18px; font-weight:600; margin-bottom:12px;}
  .status.ok{color:var(--ok);}
  .status.pay{color:var(--warn);}
  .status.err{color:var(--err);}
  .detail{font-size:15px; color:var(--muted); line-height:1.6;}
  .detail b{color:var(--fg);}
  .fee-box{background:#fafafa; border-radius:12px; padding:16px; margin:16px 0; text-align:center;}
  .fee-box .amount{font-size:36px; font-weight:600; color:var(--fg);}
  .fee-box .unit{font-size:14px; color:var(--muted); margin-top:4px;}
  .history{margin-top:20px;}
  .history h3{font-size:14px; color:var(--muted); margin:0 0 12px; font-weight:500;}
  .history-item{padding:12px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .history-item:first-child{border-top:none;}
  .history-item .info{font-size:15px;}
  .history-item .tag{font-size:12px; padding:4px 10px; background:var(--line); border-radius:20px; color:var(--muted);}
  .loading{text-align:center; color:var(--muted); padding:40px 0;}
  .spinner{width:28px; height:28px; border:2px solid var(--line); border-top-color:var(--fg); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{margin-top:auto; padding-top:24px; text-align:center; font-size:12px; color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>師大影像藝術創作社</h1>
    <div class="subtitle">輸入姓名與電話末四碼進行社課簽到，幹部收現金後會提供領收據密碼。</div>
  </header>

  <div class="card" id="formCard">
    <label for="name">姓名</label>
    <input type="text" id="name" placeholder="輸入報名姓名" autocomplete="name">

    <label for="last4" style="margin-top:16px;">電話末四碼</label>
    <input type="tel" id="last4" placeholder="0000" maxlength="4" inputmode="numeric" pattern="[0-9]{4}">

    <button class="btn" id="btnCheckin">查詢簽到狀態</button>
  </div>

  <div class="card result" id="resultCard">
    <div id="resultContent"></div>
  </div>

  <footer>
    師大影像藝術創作社 · 點名繳費收據系統
  </footer>
</div>

<script>
// TODO: 更換成部署後的 GAS Web App URL
const API_URL = 'https://script.google.com/macros/s/AKfycbyyCMJBLqtjN8rUH6i-IDOrmVyWPpTt99D1_zNDrCOwbbisi6jjlOhPEaIa6VPgV8fN/exec';

const $ = id => document.getElementById(id);

function formatMoney(n) {
  return '$' + Number(n).toLocaleString('zh-TW');
}

async function callAPI(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action, ...payload })
  });
  let text;
  try {
    text = await res.text();
  } catch (e) {
    throw new Error('無法讀取伺服器回應');
  }
  // 嘗試解析 JSON
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    // 回應不是 JSON（通常是 GAS 錯誤頁），把原始內容丟出讓使用者看到
    throw new Error('伺服器回傳非預期內容：' + text.slice(0, 300));
  }
  if (json.status === 'error') {
    throw new Error(json.message || '伺服器錯誤');
  }
  return json;
}

$('btnCheckin').addEventListener('click', async () => {
  const name = $('name').value.trim();
  const last4 = $('last4').value.trim();

  if (!name || !/^\d{4}$/.test(last4)) {
    showResult('err', '請輸入完整姓名與 4 位數字');
    return;
  }

  $('btnCheckin').disabled = true;
  $('resultCard').classList.add('show');
  $('resultContent').innerHTML = '<div class="loading"><div class="spinner"></div>查詢中...</div>';

  try {
    const data = await callAPI('checkin', { last4 });
    renderResult(data);
  } catch (err) {
    showResult('err', err.message || '連線發生問題，請確認網路後再試');
  } finally {
    $('btnCheckin').disabled = false;
  }
});

function showResult(type, message) {
  const icon = type === 'ok' ? '✓' : type === 'pay' ? '$' : '✕';
  $('resultCard').classList.add('show');
  $('resultContent').innerHTML = `
    <div class="status ${type}"><span>${icon}</span>${message}</div>
  `;
}

function renderResult(data) {
  if (data.status === 'error') {
    showResult('err', data.message);
    return;
  }

  if (data.checkedIn) {
    // 已簽到無需繳費
    let html = `
      <div class="status ok"><span>✓</span>簽到成功</div>
      <div class="detail">
        <b>${data.member.name}</b>您已完成今日 <b>${data.course.name}</b> 簽到。<br>
        ${data.fee === 0 ? '本堂無需繳費。' : ''}
      </div>
    `;

    if (data.history && data.history.length > 0) {
      html += '<div class="history"><h3>歷史收據</h3>';
      data.history.forEach(h => {
        html += `
          <div class="history-item">
            <div class="info">
              <div><b>${h.receiptItem}</b></div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px;">${h.courseDate}</div>
            </div>
            <div>
              <span class="tag">${formatMoney(h.fee)}</span>
            </div>
          </div>
        `;
      });
      html += '</div>';
    }

    $('resultContent').innerHTML = html;
  } else {
    // 需要繳費
    $('resultContent').innerHTML = `
      <div class="status pay"><span>$</span>需要繳費</div>
      <div class="detail">
        <b>${data.member.name}</b>請到櫃檯繳交現金，幹部確認後會提供領收據密碼。
      </div>
      <div class="fee-box">
        <div class="amount">${formatMoney(data.fee)}</div>
        <div class="unit">${data.receiptItem}</div>
      </div>
      <button class="btn secondary" onclick="location.reload()">我已取得密碼，刷新</button>
    `;
  }
}
</script>
</body>
</html>
