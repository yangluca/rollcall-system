<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 收據 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafafa; --ink:#0a0a0a; --dim:#a0a0a0; --muted:#c0c0c0; --border:#e8e8e8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Space Grotesk', -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px; overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  .head{text-align:center; margin-bottom:12px;}
  .head .kicker{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);}
  .head h1{font-size:26px; font-weight:600; margin-top:8px;}
  .head p{font-size:13px; color:var(--dim); margin-top:8px;}

  /* ——— 3D 場景 ——— */
  .scene{perspective:1200px; margin:20px 0 40px;}
  .receipt{
    width:320px; height:520px; position:relative;
    transform-style:preserve-3d;
    transform:rotateX(6deg) rotateY(-18deg);
    transition:transform .15s ease-out;
    cursor:grab;
  }
  .receipt.grabbing{cursor:grabbing; transition:none;}

  /* 紙張主體 */
  .paper{
    position:absolute; inset:0; border-radius:6px;
    background:
      /* 細微紙紋 */
      radial-gradient(ellipse at 20% 0%, rgba(0,0,0,.028), transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(0,0,0,.04), transparent 55%),
      linear-gradient(#fdfcf8, #f7f4ec);
    border:1px solid #e6e2d8;
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 -1px 0 rgba(0,0,0,.04) inset,
      0 30px 60px -18px rgba(0,0,0,.28),
      0 12px 24px -12px rgba(0,0,0,.18);
  }
  /* 頂部撕線 */
  .paper::before{
    content:''; position:absolute; top:-7px; left:0; right:0; height:7px;
    background:radial-gradient(circle at 6px 100%, transparent 5.5px, #f3efe5 6px) 0 0 / 14px 7px repeat-x;
  }
  /* 底部撕線 */
  .paper::after{
    content:''; position:absolute; bottom:-7px; left:0; right:0; height:7px;
    background:radial-gradient(circle at 6px 0%, transparent 5.5px, #f3efe5 6px) 0 0 / 14px 7px repeat-x;
  }

  /* 紙上文字區 */
  .content{
    position:absolute; inset:0; padding:30px 26px;
    display:flex; flex-direction:column;
  }
  .org{text-align:center; font-size:15px; font-weight:600; letter-spacing:.06em;}
  .org-sub{text-align:center; font-size:9px; letter-spacing:.28em; color:var(--dim); margin-top:4px;}
  .title{text-align:center; font-size:11px; letter-spacing:.3em; color:var(--dim); margin-top:18px; text-transform:uppercase;}

  .fields{margin-top:22px; display:flex; flex-direction:column;}
  .frow{display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; border-bottom:1px dashed #ddd8cc; font-size:13px;}
  .frow span{color:#8a857a; font-size:12px; letter-spacing:.02em;}
  .frow b{font-weight:600; font-variant-numeric:tabular-nums;}
  .amount-row{padding:18px 0; border-bottom:1px solid #cfc9bc;}
  .amount-row b{font-size:26px; font-weight:700;}

  .stamp{position:absolute; right:28px; bottom:74px; width:64px; height:64px; border:2px solid rgba(180,40,40,.45); border-radius:50%; display:flex; align-items:center; justify-content:center; transform:rotate(-16deg);}
  .stamp div{text-align:center; color:rgba(180,40,40,.6); font-size:11px; font-weight:600; letter-spacing:.08em; line-height:1.25;}
  .sign{position:absolute; left:28px; bottom:44px; font-size:11px; color:#8a857a;}
  .sign .line{display:inline-block; width:90px; border-bottom:1px solid #8a857a; margin-left:6px;}

  .hint{margin-top:8px; font-size:12px; color:var(--muted); text-align:center;}
  .hint b{color:var(--dim); font-weight:500;}

  @media (prefers-reduced-motion: no-preference){
    .receipt.idle{animation:float 7s ease-in-out infinite;}
    @keyframes float{
      0%,100%{transform:rotateX(6deg) rotateY(-18deg);}
      50%{transform:rotateX(2deg) rotateY(-30deg);}
    }
  }
</style>
</head>
<body>

  <div class="head">
    <div class="kicker">E-Receipt · 3D Paper Model</div>
    <h1>紙本收據 · 3D 模型</h1>
    <p>拖曳旋轉 · 欄位文字直接印在紙上</p>
  </div>

  <div class="scene">
    <div class="receipt idle" id="receipt">
      <div class="paper"></div>
      <div class="content">
        <div class="org">師大影像藝術創作社</div>
        <div class="org-sub">NTNU VISUAL ARTS SOCIETY</div>
        <div class="title">收據 · Receipt</div>
        <div class="fields">
          <div class="frow"><span>收據編號 No.</span><b>R-04-007</b></div>
          <div class="frow"><span>姓名 Name</span><b>王小明</b></div>
          <div class="frow"><span>項目 Item</span><b>單堂社費（第 4 堂）</b></div>
          <div class="frow amount-row"><span>金額 Amount</span><b>NT$ 150</b></div>
          <div class="frow"><span>日期 Date</span><b>2025/09/15</b></div>
          <div class="frow"><span>方式 Method</span><b>現金 Cash</b></div>
        </div>
        <div class="stamp"><div>師大<br>影像社<br>收訖</div></div>
        <div class="sign">經辦人簽章<span class="line"></span></div>
      </div>
    </div>
  </div>

  <div class="hint">✦ <b>拖曳</b>可旋轉視角 · 欄位值（姓名/金額/項目/流水號）為動態填入</div>

<script>
  const receipt = document.getElementById('receipt');
  let rx = 6, ry = -18, dragging = false, px = 0, py = 0;

  receipt.addEventListener('pointerdown', e => {
    dragging = true; px = e.clientX; py = e.clientY;
    receipt.classList.add('grabbing');
    receipt.classList.remove('idle');
    receipt.setPointerCapture(e.pointerId);
  });
  receipt.addEventListener('pointermove', e => {
    if (!dragging) return;
    ry += (e.clientX - px) * 0.4;
    rx -= (e.clientY - py) * 0.3;
    rx = Math.max(-55, Math.min(55, rx));
    px = e.clientX; py = e.clientY;
    receipt.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  });
  const stop = e => { dragging = false; receipt.classList.remove('grabbing'); };
  receipt.addEventListener('pointerup', stop);
  receipt.addEventListener('pointercancel', stop);
</script>

</body>
</html>
