<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幹部後台 · 師大影像藝術創作社</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --fg:#0a0a0a; --muted:#6b6b6b; --line:#e8e8e8;
    --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; --blue:#2b4a9e;
    --radius:16px; --shadow:0 4px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; font-family:'Space Grotesk','PingFang TC',sans-serif; background:var(--bg); color:var(--fg);}
  .wrap{min-height:100%; max-width:480px; margin:0 auto; padding:24px 20px 40px; display:flex; flex-direction:column;}
  header{margin-bottom:20px;}
  h1{font-size:22px; font-weight:600; margin:0 0 6px; letter-spacing:-.02em;}
  .subtitle{color:var(--muted); font-size:14px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:16px;}
  label{display:block; font-size:13px; font-weight:500; margin-bottom:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  input,select,textarea{width:100%; padding:13px 15px; font-size:16px; border:1.5px solid var(--line); border-radius:12px; outline:none; font-family:inherit; background:#fff;}
  input:focus,select:focus,textarea:focus{border-color:var(--fg);}
  .btn{width:100%; padding:14px; font-size:16px; font-weight:600; border:none; border-radius:12px; background:var(--fg); color:#fff; cursor:pointer; margin-top:12px; transition:transform .1s, opacity .15s;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.secondary{background:#fff; color:var(--fg); border:1.5px solid var(--line);}
  .btn.small{width:auto; padding:9px 14px; font-size:13px; margin-top:0; border-radius:9px;}
  .btn.small.warn{background:var(--warn);}
  .btn.small.blue{background:var(--blue);}
  .status{display:flex; align-items:center; gap:10px; font-size:17px; font-weight:600; margin-bottom:12px;}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--err);}
  .detail{font-size:14px; color:var(--muted); line-height:1.6;}
  .detail b{color:var(--fg);}
  .code-box{background:#f0f7ff; border:2px solid var(--blue); border-radius:12px; padding:16px; text-align:center; margin:14px 0;}
  .code-box .code{font-size:36px; font-weight:600; color:var(--blue); letter-spacing:.2em;}
  .code-box .hint{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.5;}
  .loading{text-align:center; color:var(--muted); padding:32px 0;}
  .spinner{width:26px; height:26px; border:2px solid var(--line); border-top-color:var(--fg); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 10px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{margin-top:auto; padding-top:24px; text-align:center; font-size:12px; color:var(--muted);}
  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab{flex:1; padding:12px 6px; text-align:center; font-size:14px; font-weight:500; border-radius:10px; cursor:pointer; background:#fafafa; color:var(--muted); border:1px solid var(--line);}
  .tab.active{background:var(--fg); color:#fff; border-color:var(--fg);}
  .section{display:none;}
  .section.active{display:block;}
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px;}
  .topbar .course{font-size:14px; font-weight:600;}
  .topbar .course span{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:2px;}
  .icon-btns{display:flex; gap:8px;}
  .icon-btn{padding:8px 12px; font-size:13px; border:1.5px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; font-family:inherit; color:var(--fg); white-space:nowrap;}
  .member-row{border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:10px; cursor:pointer; background:#fff;}
  .member-row .line1{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .member-row .name{font-size:16px; font-weight:600;}
  .member-row .meta{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.5;}
  .badges{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .badge{font-size:11px; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .badge.type{background:var(--line); color:var(--muted);}
  .badge.unpaid{background:#fdf3e3; color:var(--warn); font-weight:600;}
  .badge.paid{background:#e6f4ea; color:var(--ok);}
  .badge.attended{background:#e8f0fd; color:var(--blue);}
  .badge.note{background:#f3e8fd; color:#6f42c1;}
  .actions{display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
  .actions.show{display:block;}
  .action-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .inline-panel{margin-top:12px; background:#fafafa; border-radius:10px; padding:14px;}
  .inline-panel label{margin-top:8px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat-box{background:#fafafa; border-radius:12px; padding:14px; text-align:center;}
  .stat-box .num{font-size:26px; font-weight:600;}
  .stat-box .lbl{font-size:12px; color:var(--muted); margin-top:4px;}
  .mini-list{font-size:14px;}
  .mini-item{display:flex; justify-content:space-between; gap:8px; padding:9px 0; border-top:1px solid var(--line); line-height:1.4;}
  .mini-item:first-child{border-top:none;}
  .mini-item .r{color:var(--muted); white-space:nowrap;}
  h3.sec{font-size:14px; color:var(--muted); margin:18px 0 10px; font-weight:500;}
  /* v2.4 系列課程 */
  .badge.series{background:#eaf5f0; color:#0f6e56;}
  .btn.small.green{background:#0f6e56;}
  .sess-row{display:flex; align-items:center; gap:10px; color:var(--fg); font-weight:400; padding:10px 0; border-top:1px solid var(--line); font-size:14px; line-height:1.4;}
  .sess-row:first-of-type{border-top:none;}
  .sess-row input{width:20px; height:20px; padding:0; flex:none; accent-color:var(--fg);}
  .sess-row .s-main{flex:1;}
  .sess-row .s-sub{font-size:12px; color:var(--muted);}
  .sess-row.disabled{color:var(--muted);}
  .code-list{background:#f0f7ff; border:2px solid var(--blue); border-radius:12px; padding:12px 16px; margin:14px 0;}
  .code-list .ci{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-top:1px solid #d6e3f7; font-size:14px;}
  .code-list .ci:first-child{border-top:none;}
  .code-list .ci b{font-size:20px; letter-spacing:.12em; color:var(--blue);}
  .sx-sessions{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; margin-bottom:12px;}
  .sx-sess{background:#fafafa; border-radius:10px; padding:10px; font-size:12px; color:var(--muted); line-height:1.5;}
  .sx-sess.today{background:#f0f7ff; box-shadow:inset 0 0 0 1.5px var(--blue);}
  .sx-sess .t{font-size:13px; font-weight:600; color:var(--fg);}
  .sx-table{width:100%; border-collapse:collapse; font-size:14px;}
  .sx-table th{font-size:12px; color:var(--muted); font-weight:500; padding:6px 2px; text-align:center;}
  .sx-table th:first-child, .sx-table td:first-child{text-align:left;}
  .sx-table td{padding:8px 2px; border-top:1px solid var(--line); text-align:center; vertical-align:middle;}
  .sx-cell{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px; font-size:13px; font-weight:600;}
  .sx-cell.paid{background:#e6f4ea; color:var(--ok);}
  .sx-cell.enrolled{background:#fdf3e3; color:var(--warn);}
  .sx-cell.none{color:#c4c4c4; font-weight:400;}
  .sx-cell.att{box-shadow:inset 0 -3px 0 var(--blue);}
  .sx-legend{display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--muted); margin:6px 0 12px;}
  .sx-legend span{display:inline-flex; align-items:center; gap:4px;}
  .sx-legend .sx-cell{width:20px; height:20px; font-size:11px;}
  .toast{position:sticky; bottom:12px; background:var(--fg); color:#fff; padding:12px 16px; border-radius:12px; font-size:14px; text-align:center; display:none; z-index:10;}
  .toast.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>幹部後台</h1>
    <div class="subtitle">名單點名、收款、現場報名、金流報表。</div>
  </header>

  <!-- 登入 -->
  <div class="card" id="loginCard">
    <label for="staffPassword">幹部密碼</label>
    <input type="password" id="staffPassword" placeholder="輸入幹部密碼" maxlength="20">
    <button class="btn" id="btnLogin">進入後台</button>
    <div class="detail" id="loginMsg" style="margin-top:10px; color:var(--err);"></div>
  </div>

  <!-- 主畫面 -->
  <div id="mainArea" style="display:none;">
    <div class="topbar">
      <div class="course" id="courseInfo">今日課程<span></span></div>
      <div class="icon-btns">
        <button class="icon-btn" id="btnRefresh">重新整理</button>
        <button class="icon-btn" id="btnSync">同步名單</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="roster">名單</div>
      <div class="tab" data-tab="walkin">現場報名</div>
      <div class="tab" data-tab="report">報表</div>
      <div class="tab" data-tab="series">系列課程</div>
    </div>

    <!-- 名單 -->
    <div class="section active" id="tab-roster">
      <input type="search" id="searchBox" placeholder="搜尋姓名或末四碼（可搜全體社員）" style="margin-bottom:10px;">
      <div class="tabs" style="margin-bottom:14px;">
        <div class="tab active" id="filterToday">今日相關</div>
        <div class="tab" id="filterAll">全部社員</div>
      </div>
      <div id="memberList"></div>
    </div>

    <!-- 現場報名 -->
    <div class="section" id="tab-walkin">
      <div class="card">
        <label for="wName">姓名</label>
        <input type="text" id="wName" placeholder="社員姓名">
        <label for="wPhone" style="margin-top:12px;">電話（全碼）</label>
        <input type="tel" id="wPhone" placeholder="0912345678" maxlength="12" inputmode="tel">
        <label for="wIdentity" style="margin-top:12px;">身份</label>
        <select id="wIdentity">
          <option value="student">學生</option>
          <option value="public">社會人士</option>
        </select>
        <label for="wMemberType" style="margin-top:12px;">方案</label>
        <select id="wMemberType">
          <option value="single">單堂社員</option>
          <option value="semester">學期社員</option>
        </select>
        <button class="btn" id="btnWalkin">建立報名並計算費用</button>
      </div>
      <div id="walkinResult"></div>
    </div>

    <!-- v2.4 系列課程總覽 -->
    <div class="section" id="tab-series">
      <div id="seriesContent">
        <div class="loading"><div class="spinner"></div>載入中...</div>
      </div>
    </div>

    <!-- 報表 -->
    <div class="section" id="tab-report">
      <div id="reportContent">
        <div class="loading"><div class="spinner"></div>載入中...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <footer>師大影像藝術創作社 · 點名繳費收據系統</footer>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyyCMJBLqtjN8rUH6i-IDOrmVyWPpTt99D1_zNDrCOwbbisi6jjlOhPEaIa6VPgV8fN/exec';
const $ = id => document.getElementById(id);

// XSS 防護：動態文字插入 innerHTML 前一律跳脫。
// 關鍵：姓名/備注來自公開報名表單，攻擊者可塞入惡意 HTML 竊取幹部密碼（存於 staffPassword 變數）
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let staffPassword = '';
let rosterData = null;      // 最近一次 roster 回應
let showAll = false;        // 名單篩選：今日相關 / 全部
let expandedRow = null;     // 目前展開操作的 members rowIndex

// v2.2：無課日後台照常開啟（roster.course = null 時的顯示與操作調整）
function renderCourseInfo() {
  if (!rosterData) return;
  if (!rosterData.course) {
    $('courseInfo').innerHTML = '今日沒有社課<span>名單與資料維護模式</span>';
    return;
  }
  const c = rosterData.course;
  $('courseInfo').innerHTML = `${escapeHtml(c.name)}<span>${escapeHtml(c.date)} ・ ${rosterData.members.filter(m=>m.relevant).length} 人今日相關${c.series ? ' ・ 系列：' + escapeHtml(c.series) : ''}</span>`;
}

function syncFilterUI() {
  $('filterToday').classList.toggle('active', !showAll);
  $('filterAll').classList.toggle('active', showAll);
}

function formatMoney(n) { return '$' + Number(n).toLocaleString('zh-TW'); }
function fmtTime(t) {
  const d = new Date(t);
  if (isNaN(d.getTime())) return '';
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function sleepMs(ms) { return new Promise(r => setTimeout(r, ms)); }

async function callAPI(action, payload) {
  const maxTry = 3;
  let lastErr = null;
  for (let attempt = 1; attempt <= maxTry; attempt++) {
    let text = null;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action, ...payload })
      });
      text = await res.text();
    } catch (e) {
      lastErr = new Error('網路連線失敗，請確認網路後再試');
      if (attempt < maxTry) { await sleepMs(700 * attempt); continue; }
      throw lastErr;
    }
    let json = null;
    try { json = JSON.parse(text); }
    catch (e) {
      lastErr = new Error('伺服器忙線中，請稍候再試一次');
      if (attempt < maxTry) { await sleepMs(700 * attempt); continue; }
      throw lastErr;
    }
    if (json.status === 'error') throw new Error(json.message || '伺服器錯誤');
    return json;
  }
  throw lastErr;
}

function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.style.background = isErr ? 'var(--err)' : 'var(--fg)';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ===== 登入 =====
$('btnLogin').addEventListener('click', async () => {
  staffPassword = $('staffPassword').value.trim();
  if (!staffPassword) { $('loginMsg').textContent = '請輸入幹部密碼'; return; }
  $('btnLogin').disabled = true;
  $('loginMsg').textContent = '';
  try {
    const data = await callAPI('roster', { staffPassword });
    rosterData = data;
    showAll = !data.course; // 無課日直接顯示全體名單
    syncFilterUI();
    $('loginCard').style.display = 'none';
    $('mainArea').style.display = 'block';
    renderCourseInfo();
    renderMemberList();
  } catch (err) {
    $('loginMsg').textContent = err.message;
  } finally {
    $('btnLogin').disabled = false;
  }
});

// ===== 分頁切換 =====
document.querySelectorAll('.tabs .tab[data-tab]').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tabs .tab[data-tab]').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    $('tab-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'report') loadReport();
    if (tab.dataset.tab === 'series') loadSeries();
  });
});

// ===== 名單篩選 =====
$('filterToday').addEventListener('click', () => { showAll = false; expandedRow = null;
  $('filterToday').classList.add('active'); $('filterAll').classList.remove('active'); renderMemberList(); });
$('filterAll').addEventListener('click', () => { showAll = true; expandedRow = null;
  $('filterAll').classList.add('active'); $('filterToday').classList.remove('active'); renderMemberList(); });
$('searchBox').addEventListener('input', () => { expandedRow = null; renderMemberList(); });

function typeLabel(m) {
  return (m.memberType === 'semester' ? '學期' : '單堂') + '・' + (m.identity === 'student' ? '學生' : '社會');
}

function renderMemberList() {
  if (!rosterData) return;
  const q = $('searchBox').value.trim().toLowerCase();
  let list = rosterData.members.slice();

  // 搜尋永遠搜全體（突然出現的社員也找得到）
  if (q) {
    list = list.filter(m =>
      String(m.name).toLowerCase().includes(q) || String(m.phoneLast4).includes(q)
    );
  } else if (!showAll && rosterData.course) {
    list = list.filter(m => m.relevant);
  }

  if (list.length === 0) {
    $('memberList').innerHTML = '<div class="detail" style="text-align:center; padding:24px 0;">沒有符合的社員。</div>';
    return;
  }

  let html = '';
  list.forEach(m => {
    const expanded = expandedRow === m.rowIndex;
    html += `<div class="member-row" data-row="${m.rowIndex}">
      <div class="line1">
        <div class="name">${escapeHtml(m.name)}</div>
        <div class="badges">
          <span class="badge type">${typeLabel(m)}</span>
          ${rosterData.course ? (m.fee > 0 ? `<span class="badge unpaid">待繳 ${formatMoney(m.fee)}</span>` : `<span class="badge paid">${m.attended ? '已繳／免繳' : '無需繳費'}</span>`) : ''}
          ${rosterData.course && m.attended ? '<span class="badge attended">已簽到</span>' : ''}
          ${m.note ? '<span class="badge note">有備注</span>' : ''}
        </div>
      </div>
      <div class="meta">末四碼 ${m.phoneLast4}${rosterData.course && !m.relevant ? ' ・ 今天沒報名（收款時會自動加收）' : ''}${m.credit > 0 ? ` ・ 可折抵 ${formatMoney(m.credit)}` : ''}${m.note ? ' ・ 備注：' + escapeHtml(m.note) : ''}</div>
      <div class="actions ${expanded ? 'show' : ''}" id="actions-${m.rowIndex}"></div>
    </div>`;
  });
  $('memberList').innerHTML = html;

  document.querySelectorAll('.member-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.actions')) return; // 操作區的點擊不觸發收合
      const idx = parseInt(row.dataset.row, 10);
      expandedRow = expandedRow === idx ? null : idx;
      renderMemberList();
      if (expandedRow) renderActions(idx);
    });
  });

  if (expandedRow) renderActions(expandedRow);
}

function renderActions(rowIndex) {
  const m = rosterData.members.find(x => x.rowIndex === rowIndex);
  if (!m) return;
  const box = $('actions-' + rowIndex);
  if (!box) return;

  let html = '<div class="action-btns">';
  if (rosterData.course) {
    if (m.fee > 0) {
      if (!m.relevant && m.memberType === 'single') {
        // 今天沒報名的單堂社員：一顆按鈕完成「加收今天＋收款」，不讓幹部選擇困難
        html += `<button class="btn small warn" data-act="payAdd">加收今天＋收款 ${formatMoney(m.fee)}</button>`;
      } else {
        html += `<button class="btn small warn" data-act="pay">收款 ${formatMoney(m.fee)}</button>`;
      }
    }
    // v2.4：今天是系列課 → 單堂社員可一次繳多堂（每堂一張收據）
    if (rosterData.course.series && m.memberType === 'single') {
      html += `<button class="btn small green" data-act="series">系列多堂一次繳</button>`;
    }
    if (!m.attended) {
      html += `<button class="btn small blue" data-act="attend">補簽到</button>`;
    } else {
      html += `<button class="btn small secondary" data-act="unattend">取消簽到</button>`;
    }
  }
  html += `<button class="btn small secondary" data-act="change">變更身份／方案</button>`;
  html += `<button class="btn small secondary" data-act="note">備注</button>`;
  html += '</div>';
  if (!rosterData.course) {
    html += '<div class="detail" style="margin-top:10px;">今日無社課：可變更資料與備注；收款與簽到將於社課當日開放。</div>';
  }
  html += '<div class="panel-slot"></div>';
  box.innerHTML = html;

  box.querySelectorAll('button[data-act]').forEach(btn => {
    btn.addEventListener('click', () => handleAction(btn.dataset.act, m, box));
  });
}

async function handleAction(act, m, box) {
  const slot = box.querySelector('.panel-slot');

  if (act === 'pay') {
    await doConfirm(m, slot);
  }

  if (act === 'payAdd') {
    // 加收今天＋收款：先把今天加入報名堂次，成功後直接進收款流程
    slot.innerHTML = '<div class="loading"><div class="spinner"></div>加收今天堂次...</div>';
    try {
      await callAPI('updateMember', { staffPassword, rowIndex: m.rowIndex, addToday: true });
    } catch (err) {
      slot.innerHTML = `<div class="detail" style="color:var(--err);">${escapeHtml(err.message)}</div>`;
      return;
    }
    await doConfirm(m, slot);
  }

  if (act === 'series') {
    await doSeries(m, slot);
  }

  if (act === 'attend') {
    // 未繳費就補簽到：只記出席、不記收款，先讓幹部確認
    if (m.fee > 0 && !confirm(`${m.name} 還有 ${formatMoney(m.fee)} 未繳。\n補簽到只記出席、不會記收款，確定要補簽到嗎？`)) return;
    slot.innerHTML = '<div class="loading"><div class="spinner"></div>簽到中...</div>';
    try {
      const r = await callAPI('markAttendance', { staffPassword, rowIndex: m.rowIndex });
      toast(r.message);
      await refreshRoster();
    } catch (err) {
      slot.innerHTML = `<div class="detail" style="color:var(--err);">${escapeHtml(err.message)}</div>`;
    }
  }

  if (act === 'unattend') {
    // 取消簽到：只刪出席紀錄，已收的款項與收據不受影響
    if (!confirm(`確定要取消 ${m.name} 今日的簽到嗎？\n（繳費紀錄與收據不會被刪除）`)) return;
    slot.innerHTML = '<div class="loading"><div class="spinner"></div>取消簽到中...</div>';
    try {
      const r = await callAPI('markAttendance', { staffPassword, rowIndex: m.rowIndex, remove: true });
      toast(r.message);
      await refreshRoster();
    } catch (err) {
      slot.innerHTML = `<div class="detail" style="color:var(--err);">${escapeHtml(err.message)}</div>`;
    }
  }

  if (act === 'change') {
    slot.innerHTML = `
      <div class="inline-panel">
        <label>身份</label>
        <select id="chgIdentity">
          <option value="student" ${m.identity === 'student' ? 'selected' : ''}>學生</option>
          <option value="public" ${m.identity === 'public' ? 'selected' : ''}>社會人士</option>
        </select>
        <label>方案</label>
        <select id="chgType">
          <option value="single" ${m.memberType === 'single' ? 'selected' : ''}>單堂社員</option>
          <option value="semester" ${m.memberType === 'semester' ? 'selected' : ''}>學期社員</option>
        </select>
        <button class="btn" id="btnApplyChange">套用變更</button>
        <div class="detail" id="chgMsg" style="margin-top:8px;"></div>
      </div>`;
    $('btnApplyChange').addEventListener('click', async () => {
      $('btnApplyChange').disabled = true;
      try {
        const r = await callAPI('updateMember', {
          staffPassword, rowIndex: m.rowIndex,
          identity: $('chgIdentity').value, memberType: $('chgType').value
        });
        let msg = `已更新：${typeLabel(r.member)}，`;
        msg += (r.fee == null) ? '費用於社課當日計算' : `今日應繳 ${formatMoney(r.fee)}`;
        if (r.credit > 0) msg += `（已折抵 ${formatMoney(r.credit)}）`;
        if (r.refundHint) msg += '。' + r.refundHint;
        toast('變更完成');
        await refreshRoster();
        expandedRow = r.member.rowIndex;
        renderMemberList();
        const newBox = $('actions-' + r.member.rowIndex);
        if (newBox) newBox.querySelector('.panel-slot').innerHTML =
          `<div class="detail" style="color:var(--ok); margin-top:8px;">${msg}</div>`;
      } catch (err) {
        $('chgMsg').textContent = err.message;
        $('chgMsg').style.color = 'var(--err)';
        $('btnApplyChange').disabled = false;
      }
    });
  }

  if (act === 'note') {
    slot.innerHTML = `
      <div class="inline-panel">
        <label>備注（會寫入 Google Sheets，跟著這位社員）</label>
        <textarea id="noteText" rows="2" placeholder="例：已私下轉帳、下次補收據…"></textarea>
        <button class="btn" id="btnSaveNote">儲存備注</button>
        <div class="detail" id="noteMsg" style="margin-top:8px;"></div>
      </div>`;
    $('btnSaveNote').addEventListener('click', async () => {
      const note = $('noteText').value.trim();
      if (!note) return;
      $('btnSaveNote').disabled = true;
      try {
        await callAPI('addNote', { staffPassword, scope: 'member', rowIndex: m.rowIndex, note });
        toast('備注已儲存');
        await refreshRoster();
      } catch (err) {
        $('noteMsg').textContent = err.message;
        $('noteMsg').style.color = 'var(--err)';
        $('btnSaveNote').disabled = false;
      }
    });
  }
}

// 收款（名單列與現場報名共用）
async function doConfirm(m, slot, afterDone) {
  slot.innerHTML = '<div class="loading"><div class="spinner"></div>確認收款中...</div>';
  try {
    const r = await callAPI('confirm', { staffPassword, rowIndex: m.rowIndex });
    slot.innerHTML = `
      <div class="status ok" style="margin-top:10px;"><span>✓</span>收款完成</div>
      <div class="detail" style="text-align:center;">
        <b>${escapeHtml(r.memberName)}</b> 已繳交 ${formatMoney(r.fee)}<br>${escapeHtml(r.receiptItem)}
      </div>
      <div class="code-box">
        <div class="code">${escapeHtml(r.code)}</div>
        <div class="hint">社員的簽到頁面會自動跳出收據，不用報這組碼。<br>（網路不順時才需要口頭告知備用）</div>
      </div>
      <label>這筆收款的備注（選填）</label>
      <textarea id="payNote" rows="2" placeholder="例：找零 $50、朋友代付…"></textarea>
      <button class="btn secondary" id="btnPayNote">存備注並完成</button>
    `;
    $('btnPayNote').addEventListener('click', async () => {
      const note = $('payNote').value.trim();
      if (note) {
        try { await callAPI('addNote', { staffPassword, scope: 'record', code: r.code, note }); } catch(e) {}
      }
      toast('已完成');
      if (afterDone) afterDone(); else { await refreshRoster(); }
    });
  } catch (err) {
    slot.innerHTML = `<div class="detail" style="color:var(--err); margin-top:8px;">${escapeHtml(err.message)}</div>`;
  }
}

// ===== v2.4 系列多堂一次繳（名單列與現場報名共用）=====
async function doSeries(m, slot, afterDone) {
  slot.innerHTML = '<div class="loading"><div class="spinner"></div>讀取系列堂次...</div>';
  let q;
  try {
    q = await callAPI('seriesQuote', { staffPassword, rowIndex: m.rowIndex });
  } catch (err) {
    slot.innerHTML = `<div class="detail" style="color:var(--err); margin-top:8px;">${escapeHtml(err.message)}</div>`;
    return;
  }
  const info = q.info;
  if (info.payableCount === 0) {
    slot.innerHTML = `<div class="detail" style="color:var(--ok); margin-top:8px;">「${escapeHtml(info.series)}」所有堂次都已繳清（或已結束）。</div>`;
    return;
  }

  let html = `<div class="inline-panel">
    <div style="font-weight:600; margin-bottom:4px;">${escapeHtml(info.series)}（共 ${info.count} 堂）</div>
    <div class="detail" style="font-size:13px; margin-bottom:6px;">每堂 ${formatMoney(info.perFee)}（${q.member.identity === 'student' ? '學生' : '社會人士'}單堂價），勾選要一起繳的堂次：</div>`;
  info.sessions.forEach(s => {
    const status = s.paid ? '已繳' : (s.past ? '已結束' : (s.isToday ? '今天' : ''));
    html += `<label class="sess-row ${s.payable ? '' : 'disabled'}" style="text-transform:none; letter-spacing:0; margin:0;">
      <input type="checkbox" class="sess-chk" value="${escapeHtml(s.key)}" ${s.payable ? 'checked' : 'disabled'}>
      <div class="s-main">第 ${s.index} 堂 ・ ${escapeHtml(s.key)}<div class="s-sub">${escapeHtml(s.name || '')}</div></div>
      <div class="s-sub">${status ? escapeHtml(status) + ' ・ ' : ''}${formatMoney(info.perFee)}</div>
    </label>`;
  });
  html += `<label style="margin-top:10px;">備注（選填）</label>
    <textarea class="sess-note" rows="2" placeholder="例：找零 $50、朋友代付…"></textarea>
    <button class="btn sess-go"></button>
    <div class="detail sess-msg" style="margin-top:8px;"></div>
  </div>`;
  slot.innerHTML = html;

  const go = slot.querySelector('.sess-go');
  const picked = () => Array.from(slot.querySelectorAll('.sess-chk:checked')).map(x => x.value);
  const refreshBtn = () => {
    const n = picked().length;
    go.textContent = n ? `確認已收現金 ${formatMoney(n * info.perFee)}（${n} 堂）` : '請至少勾選一堂';
    go.disabled = n === 0;
  };
  slot.querySelectorAll('.sess-chk').forEach(c => c.addEventListener('change', refreshBtn));
  refreshBtn();

  go.addEventListener('click', async () => {
    const dates = picked();
    if (!dates.length) return;
    if (!confirm(`確認已向 ${m.name} 收取 ${formatMoney(dates.length * info.perFee)}（${dates.length} 堂）？`)) return;
    go.disabled = true;
    const note = slot.querySelector('.sess-note').value.trim();
    slot.querySelector('.sess-msg').textContent = '';
    try {
      const r = await callAPI('confirmSeries', { staffPassword, rowIndex: m.rowIndex, dates, note });
      let out = `
        <div class="status ok" style="margin-top:10px;"><span>✓</span>系列收款完成</div>
        <div class="detail" style="text-align:center;">
          <b>${escapeHtml(r.memberName)}</b> 共繳 ${formatMoney(r.total)}（${r.receipts.length} 堂）${r.checkedInToday ? '<br>今日已同時完成簽到' : '<br>今天這堂未含在內，未自動簽到'}
        </div>
        <div class="code-list">`;
      r.receipts.forEach(x => {
        out += `<div class="ci"><span>第 ${x.index} 堂 ・ ${escapeHtml(x.key)}<br><span style="font-size:12px;color:var(--muted);">${escapeHtml(x.receiptItem)} ・ ${formatMoney(x.fee)}</span></span><b>${escapeHtml(x.code)}</b></div>`;
      });
      out += `</div>
        <div class="detail" style="font-size:13px; text-align:center;">社員簽到頁面會自動跳出全部 ${r.receipts.length} 張收據。<br>網路不順時，可口頭告知任一組密碼備用。</div>
        <button class="btn secondary sess-done">完成</button>`;
      slot.innerHTML = out;
      slot.querySelector('.sess-done').addEventListener('click', async () => {
        toast('已完成');
        if (afterDone) afterDone(); else await refreshRoster();
      });
    } catch (err) {
      slot.querySelector('.sess-msg').textContent = err.message;
      slot.querySelector('.sess-msg').style.color = 'var(--err)';
      go.disabled = false;
    }
  });
}

async function refreshRoster() {
  const data = await callAPI('roster', { staffPassword });
  rosterData = data;
  if (!data.course) showAll = true; // 無課日維持全體名單
  syncFilterUI();
  renderCourseInfo();
  renderMemberList();
}

$('btnRefresh').addEventListener('click', async () => {
  try { await refreshRoster(); toast('已重新整理'); } catch(e) { toast(e.message, true); }
});

$('btnSync').addEventListener('click', async () => {
  try {
    const data = await callAPI('syncNow', { staffPassword });
    toast(`同步完成：新增 ${data.created}、更新 ${data.updated}`);
    await refreshRoster();
  } catch (e) { toast(e.message, true); }
});

// ===== 現場報名 =====
$('btnWalkin').addEventListener('click', async () => {
  const name = $('wName').value.trim();
  const phone = $('wPhone').value.replace(/\D/g, '');
  if (!name || phone.length < 9) { toast('請輸入姓名與完整電話', true); return; }
  $('btnWalkin').disabled = true;
  try {
    const r = await callAPI('walkin', {
      staffPassword, name, phone,
      identity: $('wIdentity').value, memberType: $('wMemberType').value
    });
    const m = r.member;
    const feeBlock = (r.fee == null)
      ? '<div style="font-size:15px; color:var(--muted); text-align:center; margin:14px 0;">今日無社課，僅建立報名資料（費用於社課當日計算）</div>'
      : `<div style="font-size:30px; font-weight:600; text-align:center; margin:14px 0;">${formatMoney(r.fee)}</div>`;
    let html = `
      <div class="card">
        <div class="status ok"><span>✓</span>已建立／更新報名</div>
        <div class="detail"><b>${escapeHtml(m.name)}</b>（${m.identity === 'student' ? '學生' : '社會人士'}・${m.memberType === 'semester' ? '學期' : '單堂'}）${r.receiptItem ? '<br>品名：' + escapeHtml(r.receiptItem) : ''}</div>
        ${feeBlock}
        <div class="panel-slot"></div>
      </div>`;
    $('walkinResult').innerHTML = html;
    const slot = $('walkinResult').querySelector('.panel-slot');
    if (r.fee > 0) {
      const canSeries = r.course && r.course.series && m.memberType === 'single';
      slot.innerHTML = `<button class="btn" id="btnWalkinPay">確認已收現金 ${formatMoney(r.fee)}（只繳今天）</button>`
        + (canSeries ? `<button class="btn secondary" id="btnWalkinSeries" style="border-color:#0f6e56; color:#0f6e56;">系列「${escapeHtml(r.course.series)}」多堂一次繳</button>` : '');
      const walkinDone = async () => {
        $('wName').value = ''; $('wPhone').value = '';
        await refreshRoster();
      };
      $('btnWalkinPay').addEventListener('click', async () => {
        await doConfirm(m, slot, walkinDone);
      });
      if (canSeries) {
        $('btnWalkinSeries').addEventListener('click', async () => {
          await doSeries(m, slot, walkinDone);
        });
      }
    } else if (r.fee == null) {
      // 無課日：僅建檔，不提供收款或簽到
      $('wName').value = ''; $('wPhone').value = '';
      slot.innerHTML = '<div class="detail" style="text-align:center; color:var(--ok);">建檔完成。</div>';
    } else {
      slot.innerHTML = `<button class="btn" id="btnWalkinFree">無需繳費，完成簽到</button>`;
      $('btnWalkinFree').addEventListener('click', async () => {
        try {
          await callAPI('markAttendance', { staffPassword, rowIndex: m.rowIndex });
          toast(`${m.name} 簽到完成`);
          $('wName').value = ''; $('wPhone').value = '';
          $('walkinResult').innerHTML = '';
          await refreshRoster();
        } catch (e) { toast(e.message, true); }
      });
    }
  } catch (err) {
    toast(err.message, true);
  } finally {
    $('btnWalkin').disabled = false;
  }
});

// ===== 報表 =====
let reportLoaded = false;
async function loadReport() {
  $('reportContent').innerHTML = '<div class="loading"><div class="spinner"></div>載入中...</div>';
  try {
    const [stats, fin] = await Promise.all([
      callAPI('courseStats', { staffPassword }),
      callAPI('finance', { staffPassword })
    ]);

    // v2.4：今日實收（依收款時間），舊後端沒有此欄位時退回本堂明細
    const collected = fin.collectedToday || { total: fin.today.total, payments: fin.today.payments };
    const prepaidTotal = collected.payments.filter(p => p.prepaid).reduce((a, p) => a + (Number(p.fee) || 0), 0);

    let html = `
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${stats.attendedCount}<span style="font-size:14px;color:var(--muted);">/${stats.expectedCount}</span></div><div class="lbl">已到 / 應到</div></div>
        <div class="stat-box"><div class="num">${formatMoney(stats.todayTotal)}</div><div class="lbl">本堂收入（${stats.paidCount} 筆）</div></div>
      </div>
      <div class="stat-grid">
        <div class="stat-box" style="background:#eaf5f0;"><div class="num" style="color:#0f6e56;">${formatMoney(collected.total)}</div><div class="lbl">今日實收現金（${collected.payments.length} 筆）</div></div>
        <div class="stat-box" style="background:#f0f7ff;"><div class="num" style="color:var(--blue);">${formatMoney(fin.semesterTotal)}</div><div class="lbl">${escapeHtml(fin.semester)} 學期累計</div></div>
      </div>
      ${prepaidTotal > 0 ? `<div class="detail" style="font-size:13px; margin:-4px 0 12px;">今日實收含系列預繳後續堂次 ${formatMoney(prepaidTotal)}；「本堂收入」只計歸屬今天這堂的金額。</div>` : ''}
    `;

    if (stats.unpaid.length > 0) {
      html += `<h3 class="sec">尚未繳費（${stats.unpaid.length} 人）</h3><div class="card mini-list">`;
      stats.unpaid.forEach(u => {
        html += `<div class="mini-item"><span>${escapeHtml(u.name)}（${u.memberType === 'semester' ? '學期' : '單堂'}・${u.identity === 'student' ? '學生' : '社會'}）</span><span class="r">${formatMoney(u.fee)}</span></div>`;
      });
      html += '</div>';
    }

    if (collected.payments.length > 0) {
      html += `<h3 class="sec">今日收款明細</h3><div class="card mini-list">`;
      collected.payments.forEach(p => {
        html += `<div class="mini-item"><span>${fmtTime(p.time)} ${escapeHtml(p.name)}${p.prepaid ? ' <span class="badge series">預繳 ' + escapeHtml(p.courseDate) + '</span>' : ''}${p.note ? '（注：' + escapeHtml(p.note) + '）' : ''}<br><span style="font-size:12px;color:var(--muted);">${escapeHtml(p.item)}</span></span><span class="r">${formatMoney(p.fee)}</span></div>`;
      });
      html += '</div>';
    }

    if (fin.byItem.length > 0) {
      html += `<h3 class="sec">本學期收入（分品名）</h3><div class="card mini-list">`;
      fin.byItem.forEach(it => {
        html += `<div class="mini-item"><span>${escapeHtml(it.item)}</span><span class="r">${it.count} 筆 ・ ${formatMoney(it.total)}</span></div>`;
      });
      html += '</div>';
    }

    // v2.3：各堂金流板塊（每堂課的入帳筆數與金額，最新在前）
    if (fin.byCourse && fin.byCourse.length > 0) {
      html += `<h3 class="sec">本學期各堂金流</h3><div class="card mini-list">`;
      fin.byCourse.forEach(c => {
        html += `<div class="mini-item"><span>${escapeHtml(c.courseName || '（未命名課程）')}<br><span style="font-size:12px;color:var(--muted);">${escapeHtml(c.date)}</span></span><span class="r">${c.count} 筆 ・ ${formatMoney(c.total)}</span></div>`;
      });
      html += '</div>';
    }

    html += `<h3 class="sec">今日出席（${stats.attendedCount} 人）</h3><div class="card mini-list">`;
    if (stats.attended.length === 0) {
      html += '<div class="detail">尚無出席紀錄。</div>';
    } else {
      stats.attended.forEach(a => {
        html += `<div class="mini-item"><span>${escapeHtml(a.name)}</span><span class="r">${fmtTime(a.time)}</span></div>`;
      });
    }
    html += '</div>';

    $('reportContent').innerHTML = html;
    reportLoaded = true;
  } catch (err) {
    $('reportContent').innerHTML = `<div class="card"><div class="status err"><span>✕</span>${escapeHtml(err.message)}</div></div>`;
  }
}

// ===== v2.4 系列課程總覽：誰報名／繳費／出席了哪幾堂 =====
async function loadSeries() {
  $('seriesContent').innerHTML = '<div class="loading"><div class="spinner"></div>載入中...</div>';
  try {
    const data = await callAPI('seriesOverview', { staffPassword });
    if (!data.series || data.series.length === 0) {
      $('seriesContent').innerHTML = '<div class="card detail">尚未設定任何系列課程。<br>在 courses 分頁 E 欄（series）為同一系列的每堂課填上相同的系列名稱即可。</div>';
      return;
    }
    let html = '';
    data.series.forEach(s => {
      html += `<div class="card">
        <div style="font-size:17px; font-weight:600;">${escapeHtml(s.name)}</div>
        <div class="detail" style="font-size:13px; margin:2px 0 12px;">單堂報名 ${s.memberCount} 人 ・ 全系列繳清 ${s.fullCount} 人${s.semesterCount ? ` ・ 另有學期社員 ${s.semesterCount} 人（全堂涵蓋）` : ''}</div>
        <div class="sx-sessions">`;
      s.sessions.forEach(x => {
        html += `<div class="sx-sess ${x.isToday ? 'today' : ''}">
          <div class="t">第 ${x.index} 堂 ${escapeHtml(x.key)}${x.isToday ? '（今天）' : ''}</div>
          ${escapeHtml(x.name || '')}<br>
          報名 ${x.enrolled} ・ 已繳 ${x.paid}<br>
          ${x.past || x.isToday ? `出席 ${x.attended} ・ ` : ''}${formatMoney(x.revenue)}
        </div>`;
      });
      html += `</div>
        <div class="sx-legend">
          <span><span class="sx-cell paid">✓</span>已繳</span>
          <span><span class="sx-cell enrolled">報</span>報名未繳</span>
          <span><span class="sx-cell none att">·</span>藍底線＝已出席</span>
          <span><span class="badge series">套</span>系列一次繳</span>
        </div>`;
      if (s.members.length === 0) {
        html += '<div class="detail">目前沒有單堂社員報名這個系列。</div>';
      } else {
        html += `<table class="sx-table"><thead><tr><th>姓名</th>${s.sessions.map(x => `<th>${x.index}<br><span style="font-size:11px;">${escapeHtml(x.key)}</span></th>`).join('')}</tr></thead><tbody>`;
        s.members.forEach(m => {
          html += `<tr><td>${escapeHtml(m.name)}${m.bundle ? ' <span class="badge series">套</span>' : ''}<div style="font-size:11px;color:var(--muted);">${escapeHtml(m.phoneLast4)} ・ ${m.paidCount}/${s.sessions.length} 堂已繳</div></td>`;
          m.cells.forEach(c => {
            const cls = c.paid ? 'paid' : (c.enrolled ? 'enrolled' : 'none');
            const txt = c.paid ? '✓' : (c.enrolled ? '報' : '·');
            html += `<td><span class="sx-cell ${cls} ${c.attended ? 'att' : ''}">${txt}</span></td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
      }
      html += '</div>';
    });
    $('seriesContent').innerHTML = html;
  } catch (err) {
    $('seriesContent').innerHTML = `<div class="card"><div class="status err"><span>✕</span>${escapeHtml(err.message)}</div></div>`;
  }
}
</script>
