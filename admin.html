<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幹部後台 · 師大影像藝術創作社</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --fg:#0a0a0a; --muted:#6b6b6b; --line:#e8e8e8;
    --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; --blue:#2b4a9e;
    --radius:16px; --shadow:0 4px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; font-family:'Space Grotesk','PingFang TC',sans-serif; background:var(--bg); color:var(--fg);}
  .wrap{min-height:100%; max-width:480px; margin:0 auto; padding:24px 20px 40px; display:flex; flex-direction:column;}
  header{margin-bottom:20px;}
  h1{font-size:22px; font-weight:600; margin:0 0 6px; letter-spacing:-.02em;}
  .subtitle{color:var(--muted); font-size:14px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:16px;}
  label{display:block; font-size:13px; font-weight:500; margin-bottom:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  input,select,textarea{width:100%; padding:13px 15px; font-size:16px; border:1.5px solid var(--line); border-radius:12px; outline:none; font-family:inherit; background:#fff;}
  input:focus,select:focus,textarea:focus{border-color:var(--fg);}
  .btn{width:100%; padding:14px; font-size:16px; font-weight:600; border:none; border-radius:12px; background:var(--fg); color:#fff; cursor:pointer; margin-top:12px; transition:transform .1s, opacity .15s;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.secondary{background:#fff; color:var(--fg); border:1.5px solid var(--line);}
  .btn.small{width:auto; padding:9px 14px; font-size:13px; margin-top:0; border-radius:9px;}
  .btn.small.warn{background:var(--warn);}
  .btn.small.blue{background:var(--blue);}
  .status{display:flex; align-items:center; gap:10px; font-size:17px; font-weight:600; margin-bottom:12px;}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--err);}
  .detail{font-size:14px; color:var(--muted); line-height:1.6;}
  .detail b{color:var(--fg);}
  .code-box{background:#f0f7ff; border:2px solid var(--blue); border-radius:12px; padding:16px; text-align:center; margin:14px 0;}
  .code-box .code{font-size:36px; font-weight:600; color:var(--blue); letter-spacing:.2em;}
  .code-box .hint{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.5;}
  .loading{text-align:center; color:var(--muted); padding:32px 0;}
  .spinner{width:26px; height:26px; border:2px solid var(--line); border-top-color:var(--fg); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 10px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{margin-top:auto; padding-top:24px; text-align:center; font-size:12px; color:var(--muted);}
  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab{flex:1; padding:12px 6px; text-align:center; font-size:14px; font-weight:500; border-radius:10px; cursor:pointer; background:#fafafa; color:var(--muted); border:1px solid var(--line);}
  .tab.active{background:var(--fg); color:#fff; border-color:var(--fg);}
  .section{display:none;}
  .section.active{display:block;}
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px;}
  .topbar .course{font-size:14px; font-weight:600;}
  .topbar .course span{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:2px;}
  .icon-btns{display:flex; gap:8px;}
  .icon-btn{padding:8px 12px; font-size:13px; border:1.5px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; font-family:inherit; color:var(--fg); white-space:nowrap;}
  .member-row{border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:10px; cursor:pointer; background:#fff;}
  .member-row .line1{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .member-row .name{font-size:16px; font-weight:600;}
  .member-row .meta{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.5;}
  .badges{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .badge{font-size:11px; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .badge.type{background:var(--line); color:var(--muted);}
  .badge.unpaid{background:#fdf3e3; color:var(--warn); font-weight:600;}
  .badge.paid{background:#e6f4ea; color:var(--ok);}
  .badge.attended{background:#e8f0fd; color:var(--blue);}
  .badge.note{background:#f3e8fd; color:#6f42c1;}
  .actions{display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
  .actions.show{display:block;}
  .action-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .inline-panel{margin-top:12px; background:#fafafa; border-radius:10px; padding:14px;}
  .inline-panel label{margin-top:8px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat-box{background:#fafafa; border-radius:12px; padding:14px; text-align:center;}
  .stat-box .num{font-size:26px; font-weight:600;}
  .stat-box .lbl{font-size:12px; color:var(--muted); margin-top:4px;}
  .mini-list{font-size:14px;}
  .mini-item{display:flex; justify-content:space-between; gap:8px; padding:9px 0; border-top:1px solid var(--line); line-height:1.4;}
  .mini-item:first-child{border-top:none;}
  .mini-item .r{color:var(--muted); white-space:nowrap;}
  h3.sec{font-size:14px; color:var(--muted); margin:18px 0 10px; font-weight:500;}
  /* v2.4 系列課程 */
  .badge.series{background:#eaf5f0; color:#0f6e56;}
  .btn.small.green{background:#0f6e56;}
  .sess-row{display:flex; align-items:center; gap:10px; color:var(--fg); font-weight:400; padding:10px 0; border-top:1px solid var(--line); font-size:14px; line-height:1.4;}
  .sess-row:first-of-type{border-top:none;}
  .sess-row input{width:20px; height:20px; padding:0; flex:none; accent-color:var(--fg);}
  .sess-row .s-main{flex:1;}
  .sess-row .s-sub{font-size:12px; color:var(--muted);}
  .sess-row.disabled{color:var(--muted);}
  .code-list{background:#f0f7ff; border:2px solid var(--blue); border-radius:12px; padding:12px 16px; margin:14px 0;}
  .code-list .ci{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-top:1px solid #d6e3f7; font-size:14px;}
  .code-list .ci:first-child{border-top:none;}
  .code-list .ci b{font-size:20px; letter-spacing:.12em; color:var(--blue);}
  .sx-sessions{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; margin-bottom:12px;}
  .sx-sess{background:#fafafa; border-radius:10px; padding:10px; font-size:12px; color:var(--muted); line-height:1.5;}
  .sx-sess.today{background:#f0f7ff; box-shadow:inset 0 0 0 1.5px var(--blue);}
  .sx-sess .t{font-size:13px; font-weight:600; color:var(--fg);}
  .sx-table{width:100%; border-collapse:collapse; font-size:14px;}
  .sx-table th{font-size:12px; color:var(--muted); font-weight:500; padding:6px 2px; text-align:center;}
  .sx-table th:first-child, .sx-table td:first-child{text-align:left;}
  .sx-table td{padding:8px 2px; border-top:1px solid var(--line); text-align:center; vertical-align:middle;}
  .sx-cell{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px; font-size:13px; font-weight:600;}
  .sx-cell.paid{background:#e6f4ea; color:var(--ok);}
  .sx-cell.enrolled{background:#fdf3e3; color:var(--warn);}
  .sx-cell.none{color:#c4c4c4; font-weight:400;}
  .sx-cell.att{box-shadow:inset 0 -3px 0 var(--blue);}
  .sx-legend{display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--muted); margin:6px 0 12px;}
  .sx-legend span{display:inline-flex; align-items:center; gap:4px;}
  .sx-legend .sx-cell{width:20px; height:20px; font-size:11px;}
  /* v2.5 前幹部 */
  .badge.alumni{background:#fbeee6; color:#a3471b; font-weight:600;}
  .badge.refund{background:#fde8e8; color:var(--err);}
  .btn.small.alumni{background:#a3471b;}
  /* v2.6 背景工作列 */
  body.has-tray .wrap{padding-bottom:110px;}
  .tray{position:fixed; left:50%; transform:translateX(-50%); bottom:10px; width:calc(100% - 20px); max-width:460px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 32px rgba(0,0,0,.16); z-index:20; overflow:hidden;}
  .tray-head{display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer; font-size:14px; font-weight:600; background:#fafafa;}
  .tray-title{display:flex; align-items:center; gap:8px;}
  .tray-counts{display:flex; gap:8px; font-size:13px;}
  .tray-counts .c-ok{color:var(--ok);} .tray-counts .c-err{color:var(--err);}
  .tray-arrow{margin-left:auto; font-size:12px; color:var(--muted); font-weight:400;}
  .tray-peek{display:flex; align-items:center; gap:8px; padding:8px 14px 11px; font-size:13px; border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tray-body{max-height:50vh; overflow-y:auto; border-top:1px solid var(--line);}
  .task{padding:10px 14px; border-top:1px solid var(--line); font-size:13px; line-height:1.5;}
  .task:first-child{border-top:none;}
  .task.st-err{background:#fdf2f2;} .task.st-warn{background:#fdf8ec;}
  .t-head{display:flex; align-items:center; gap:8px;}
  .t-main{flex:1;}
  .t-time{font-size:11px; color:var(--muted);}
  .t-detail{margin:4px 0 0 24px; color:var(--muted);}
  .task.st-err .t-detail{color:var(--err);}
  .t-code{color:var(--blue); letter-spacing:.08em; font-size:15px;}
  .t-codes{display:flex; flex-wrap:wrap; gap:4px 12px; margin:2px 0;}
  .t-refund{color:var(--err); font-weight:600; font-size:16px; margin:2px 0;}
  .t-actions{display:flex; gap:8px; margin:6px 0 0 24px; flex-wrap:wrap; align-items:center;}
  .t-actions:empty{display:none;}
  .t-btn{padding:5px 11px; font-size:12px; border-radius:8px; border:1.5px solid var(--fg); background:var(--fg); color:#fff; cursor:pointer; font-family:inherit;}
  .t-btn.ghost{background:#fff; color:var(--muted); border-color:var(--line);}
  .t-saved{font-size:12px; color:var(--ok);}
  .t-note{display:flex; gap:6px; margin:6px 0 0 24px;}
  .t-note input{padding:7px 10px; font-size:14px; border-radius:8px;}
  .tray-foot{padding:8px 14px; border-top:1px solid var(--line); text-align:right;}
  .t-ic{display:inline-flex; width:16px; justify-content:center; font-weight:700;}
  .t-ic.ok{color:var(--ok);} .t-ic.err{color:var(--err);} .t-ic.warn{color:var(--warn);}
  .mini-spin{display:inline-block; width:13px; height:13px; border:2px solid var(--line); border-top-color:var(--fg); border-radius:50%; animation:spin .8s linear infinite; flex:none;}
  .badge.busy{background:#eef2f8; color:var(--blue); display:inline-flex; align-items:center; gap:5px;}
  .badge.busy .mini-spin{width:10px; height:10px; border-top-color:var(--blue);}
  .busy-note{font-size:12px; color:var(--blue); margin-top:8px;}
  /* v2.7 出席統計＋篩選 */
  .att-bar{background:#fafafa; border-radius:12px; padding:12px 14px; margin-bottom:12px;}
  .att-sum{display:flex; align-items:baseline; gap:6px; font-size:14px; color:var(--muted);}
  .att-sum .big{font-size:24px; font-weight:600; color:var(--fg);}
  .att-sum .pct{margin-left:auto; font-size:13px;}
  .att-prog{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0 10px;}
  .att-prog i{display:block; height:100%; background:var(--blue); border-radius:4px; transition:width .3s;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{padding:7px 12px; font-size:13px; border-radius:20px; border:1.5px solid var(--line); background:#fff; cursor:pointer; font-family:inherit; color:var(--fg); display:inline-flex; align-items:center; gap:5px;}
  .chip b{font-weight:600;}
  .chip.active{background:var(--fg); color:#fff; border-color:var(--fg);}
  .chip.c-in b{color:var(--blue);} .chip.c-out b{color:var(--warn);} .chip.c-unpaid b{color:var(--err);}
  .chip.active b{color:#fff;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:14px; max-width:440px; width:calc(100% - 40px); box-sizing:border-box; background:var(--fg); color:#fff; padding:12px 16px; border-radius:12px; font-size:14px; text-align:center; display:none; z-index:30;}
  body.has-tray .toast{bottom:100px;}
  .toast.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>幹部後台</h1>
    <div class="subtitle">名單點名、收款、現場報名、金流報表。</div>
  </header>

  <!-- 登入 -->
  <div class="card" id="loginCard">
    <label for="staffPassword">幹部密碼</label>
    <input type="password" id="staffPassword" placeholder="輸入幹部密碼" maxlength="20">
    <button class="btn" id="btnLogin">進入後台</button>
    <div class="detail" id="loginMsg" style="margin-top:10px; color:var(--err);"></div>
  </div>

  <!-- 主畫面 -->
  <div id="mainArea" style="display:none;">
    <div class="topbar">
      <div class="course" id="courseInfo">今日課程<span></span></div>
      <div class="icon-btns">
        <button class="icon-btn" id="btnRefresh">重新整理</button>
        <button class="icon-btn" id="btnSync">同步名單</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="roster">名單</div>
      <div class="tab" data-tab="walkin">現場報名</div>
      <div class="tab" data-tab="report">報表</div>
      <div class="tab" data-tab="series">系列課程</div>
    </div>

    <!-- 名單 -->
    <div class="section active" id="tab-roster">
      <input type="search" id="searchBox" placeholder="搜尋姓名或末四碼（可搜全體社員）" style="margin-bottom:10px;">
      <div class="tabs" style="margin-bottom:14px;">
        <div class="tab active" id="filterToday">今日相關</div>
        <div class="tab" id="filterAll">全部社員</div>
      </div>
      <!-- v2.7 出席統計＋篩選（有課日才顯示） -->
      <div id="attBar"></div>
      <div id="memberList"></div>
    </div>

    <!-- 現場報名 -->
    <div class="section" id="tab-walkin">
      <div class="card">
        <label for="wName">姓名</label>
        <input type="text" id="wName" placeholder="社員姓名">
        <label for="wPhone" style="margin-top:12px;">電話（全碼）</label>
        <input type="tel" id="wPhone" placeholder="0912345678" maxlength="12" inputmode="tel">
        <label for="wIdentity" style="margin-top:12px;">身份</label>
        <select id="wIdentity">
          <option value="student">學生</option>
          <option value="public">社會人士</option>
          <option value="alumni">前幹部（全部免費）</option>
        </select>
        <label for="wMemberType" style="margin-top:12px;">方案</label>
        <select id="wMemberType">
          <option value="single">單堂社員</option>
          <option value="semester">學期社員</option>
        </select>
        <button class="btn" id="btnWalkin">建立報名並計算費用</button>
      </div>
      <div id="walkinResult"></div>
    </div>

    <!-- v2.4 系列課程總覽 -->
    <div class="section" id="tab-series">
      <div id="seriesContent">
        <div class="loading"><div class="spinner"></div>載入中...</div>
      </div>
    </div>

    <!-- 報表 -->
    <div class="section" id="tab-report">
      <div id="reportContent">
        <div class="loading"><div class="spinner"></div>載入中...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <!-- v2.6 背景工作列 -->
  <div class="tray" id="tray" style="display:none;"></div>
  <footer>師大影像藝術創作社 · 點名繳費收據系統</footer>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyyCMJBLqtjN8rUH6i-IDOrmVyWPpTt99D1_zNDrCOwbbisi6jjlOhPEaIa6VPgV8fN/exec';
const $ = id => document.getElementById(id);

// XSS 防護：動態文字插入 innerHTML 前一律跳脫。
// 關鍵：姓名/備注來自公開報名表單，攻擊者可塞入惡意 HTML 竊取幹部密碼（存於 staffPassword 變數）
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let staffPassword = '';
let rosterData = null;      // 最近一次 roster 回應
let showAll = false;        // 名單篩選：今日相關 / 全部
let expandedRow = null;     // 目前展開操作的 members rowIndex

// v2.2：無課日後台照常開啟（roster.course = null 時的顯示與操作調整）
function renderCourseInfo() {
  if (!rosterData) return;
  if (!rosterData.course) {
    $('courseInfo').innerHTML = '今日沒有社課<span>名單與資料維護模式</span>';
    return;
  }
  const c = rosterData.course;
  $('courseInfo').innerHTML = `${escapeHtml(c.name)}<span>${escapeHtml(c.date)} ・ ${rosterData.members.filter(m=>m.relevant).length} 人今日相關${c.series ? ' ・ 系列：' + escapeHtml(c.series) : ''}</span>`;
}

function syncFilterUI() {
  $('filterToday').classList.toggle('active', !showAll);
  $('filterAll').classList.toggle('active', showAll);
}

function formatMoney(n) { const v = Number(n) || 0; return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('zh-TW'); }
function fmtTime(t) {
  const d = new Date(t);
  if (isNaN(d.getTime())) return '';
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function sleepMs(ms) { return new Promise(r => setTimeout(r, ms)); }

async function callAPI(action, payload) {
  const maxTry = 3;
  let lastErr = null;
  for (let attempt = 1; attempt <= maxTry; attempt++) {
    let text = null;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action, ...payload })
      });
      text = await res.text();
    } catch (e) {
      lastErr = new Error('網路連線失敗，請確認網路後再試');
      if (attempt < maxTry) { await sleepMs(700 * attempt); continue; }
      throw lastErr;
    }
    let json = null;
    try { json = JSON.parse(text); }
    catch (e) {
      lastErr = new Error('伺服器忙線中，請稍候再試一次');
      if (attempt < maxTry) { await sleepMs(700 * attempt); continue; }
      throw lastErr;
    }
    if (json.status === 'error') throw new Error(json.message || '伺服器錯誤');
    return json;
  }
  throw lastErr;
}

function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.style.background = isErr ? 'var(--err)' : 'var(--fg)';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ===== 登入 =====
$('btnLogin').addEventListener('click', async () => {
  staffPassword = $('staffPassword').value.trim();
  if (!staffPassword) { $('loginMsg').textContent = '請輸入幹部密碼'; return; }
  $('btnLogin').disabled = true;
  $('loginMsg').textContent = '';
  try {
    const data = await callAPI('roster', { staffPassword });
    rosterData = data;
    showAll = !data.course; // 無課日直接顯示全體名單
    syncFilterUI();
    $('loginCard').style.display = 'none';
    $('mainArea').style.display = 'block';
    renderCourseInfo();
    renderMemberList();
  } catch (err) {
    $('loginMsg').textContent = err.message;
  } finally {
    $('btnLogin').disabled = false;
  }
});

// ===== 分頁切換 =====
document.querySelectorAll('.tabs .tab[data-tab]').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tabs .tab[data-tab]').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    $('tab-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'report') loadReport();
    if (tab.dataset.tab === 'series') loadSeries();
  });
});

// ===== 名單篩選 =====
$('filterToday').addEventListener('click', () => { showAll = false; expandedRow = null;
  $('filterToday').classList.add('active'); $('filterAll').classList.remove('active'); renderMemberList(); });
$('filterAll').addEventListener('click', () => { showAll = true; expandedRow = null;
  $('filterAll').classList.add('active'); $('filterToday').classList.remove('active'); renderMemberList(); });
$('searchBox').addEventListener('input', () => { expandedRow = null; renderMemberList(); });

function typeLabel(m) {
  return (m.memberType === 'semester' ? '學期' : '單堂') + '・' + idLabel(m.identity, true);
}

// v2.5：身份顯示（short=true 時「社會人士」縮成「社會」）
function idLabel(identity, short) {
  if (identity === 'alumni') return '前幹部';
  if (identity === 'public') return short ? '社會' : '社會人士';
  return '學生';
}

// v2.7：出席篩選 all 全部 | in 已到 | out 未到 | unpaid 待繳
let attFilter = 'all';

// 出席統計：應到 = 今日相關（學期全體＋單堂報今天）＋ 今天實際有來的人（臨時加收、現場報名）
function renderAttBar() {
  const bar = $('attBar');
  if (!rosterData || !rosterData.course) { bar.innerHTML = ''; return; }
  const base = rosterData.members.filter(m => m.relevant || m.attended);
  const inN = base.filter(m => m.attended).length;
  const outN = base.length - inN;
  const unpaidN = base.filter(m => m.fee > 0).length;
  const pct = base.length ? Math.round(inN / base.length * 100) : 0;
  const chip = (key, cls, label, n) =>
    `<button class="chip ${cls} ${attFilter === key ? 'active' : ''}" data-f="${key}">${label}${n == null ? '' : ` <b>${n}</b>`}</button>`;
  bar.innerHTML = `<div class="att-bar">
    <div class="att-sum"><span>已到</span><span class="big">${inN}</span><span>/ 應到 ${base.length}</span><span>・還沒來 ${outN}</span><span class="pct">${pct}%</span></div>
    <div class="att-prog"><i style="width:${pct}%"></i></div>
    <div class="chips">
      ${chip('all', '', '全部', null)}
      ${chip('in', 'c-in', '已到', inN)}
      ${chip('out', 'c-out', '還沒來', outN)}
      ${chip('unpaid', 'c-unpaid', '待繳', unpaidN)}
    </div>
  </div>`;
  bar.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    attFilter = attFilter === c.dataset.f ? 'all' : c.dataset.f; // 再點一次取消篩選
    expandedRow = null;
    renderMemberList();
  }));
}

function renderMemberList() {
  if (!rosterData) return;
  renderAttBar();
  const q = $('searchBox').value.trim().toLowerCase();
  let list = rosterData.members.slice();

  // 搜尋永遠搜全體（突然出現的社員也找得到）
  if (q) {
    list = list.filter(m =>
      String(m.name).toLowerCase().includes(q) || String(m.phoneLast4).includes(q)
    );
  } else if (!showAll && rosterData.course) {
    list = list.filter(m => m.relevant || m.attended);
  }

  // v2.7：出席篩選（與「今日相關／全部社員」、搜尋可疊加）
  if (rosterData.course && attFilter !== 'all') {
    if (attFilter === 'in') list = list.filter(m => m.attended);
    if (attFilter === 'out') list = list.filter(m => !m.attended);
    if (attFilter === 'unpaid') list = list.filter(m => m.fee > 0);
  }

  if (list.length === 0) {
    const hint = { in: '還沒有人簽到。', out: '應到的人都到齊了！', unpaid: '沒有待繳費的社員。' }[attFilter];
    $('memberList').innerHTML = `<div class="detail" style="text-align:center; padding:24px 0;">${(!q && hint) || '沒有符合的社員。'}</div>`;
    return;
  }

  let html = '';
  list.forEach(m => {
    const expanded = expandedRow === m.rowIndex;
    html += `<div class="member-row" data-row="${m.rowIndex}">
      <div class="line1">
        <div class="name">${escapeHtml(m.name)}</div>
        <div class="badges">
          <span class="badge type">${typeLabel(m)}</span>
          ${m.identity === 'alumni' ? '<span class="badge alumni">前幹部免費</span>' : ''}
          ${rosterData.course && m.identity !== 'alumni' ? (m.fee > 0 ? `<span class="badge unpaid">待繳 ${formatMoney(m.fee)}</span>` : `<span class="badge paid">${m.attended ? '已繳／免繳' : '無需繳費'}</span>`) : ''}
          ${rosterData.course && m.attended ? '<span class="badge attended">已簽到</span>' : ''}
          ${m.note ? '<span class="badge note">有備注</span>' : ''}
          ${busyRows[m.rowIndex] ? '<span class="badge busy"><span class="mini-spin"></span>處理中</span>' : ''}
        </div>
      </div>
      <div class="meta">末四碼 ${m.phoneLast4}${rosterData.course && !m.relevant ? ' ・ 今天沒報名（收款時會自動加收）' : ''}${m.credit > 0 ? ` ・ 可折抵 ${formatMoney(m.credit)}` : ''}${m.note ? ' ・ 備注：' + escapeHtml(m.note) : ''}</div>
      <div class="actions ${expanded ? 'show' : ''}" id="actions-${m.rowIndex}"></div>
    </div>`;
  });
  $('memberList').innerHTML = html;

  document.querySelectorAll('.member-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.actions')) return; // 操作區的點擊不觸發收合
      const idx = parseInt(row.dataset.row, 10);
      expandedRow = expandedRow === idx ? null : idx;
      renderMemberList();
      if (expandedRow) renderActions(idx);
    });
  });

  if (expandedRow) renderActions(expandedRow);
}

function renderActions(rowIndex) {
  const m = rosterData.members.find(x => x.rowIndex === rowIndex);
  if (!m) return;
  const box = $('actions-' + rowIndex);
  if (!box) return;

  let html = '<div class="action-btns">';
  if (rosterData.course) {
    if (m.fee > 0) {
      if (!m.relevant && m.memberType === 'single') {
        // 今天沒報名的單堂社員：一顆按鈕完成「加收今天＋收款」，不讓幹部選擇困難
        html += `<button class="btn small warn" data-act="payAdd">加收今天＋收款 ${formatMoney(m.fee)}</button>`;
      } else {
        html += `<button class="btn small warn" data-act="pay">收款 ${formatMoney(m.fee)}</button>`;
      }
    }
    // v2.4：今天是系列課 → 單堂社員可一次繳多堂（每堂一張收據）
    if (rosterData.course.series && m.memberType === 'single' && m.identity !== 'alumni') {
      html += `<button class="btn small green" data-act="series">系列多堂一次繳</button>`;
    }
    if (!m.attended) {
      html += `<button class="btn small blue" data-act="attend">補簽到</button>`;
    } else {
      html += `<button class="btn small secondary" data-act="unattend">取消簽到</button>`;
    }
  }
  html += `<button class="btn small secondary" data-act="change">變更身份／方案</button>`;
  // v2.5：登記前幹部（任何日子都可登記；已是前幹部則不顯示）
  if (m.identity !== 'alumni') {
    html += `<button class="btn small alumni" data-act="alumni">登記前幹部</button>`;
  }
  html += `<button class="btn small secondary" data-act="note">備注</button>`;
  html += '</div>';
  if (!rosterData.course) {
    html += '<div class="detail" style="margin-top:10px;">今日無社課：可變更資料與備注；收款與簽到將於社課當日開放。</div>';
  }
  html += '<div class="panel-slot"></div>';
  box.innerHTML = html;

  // v2.6：這位社員有工作還在跑 → 鎖住會動到金流／簽到／身份的按鈕（防重複收款），備注照常可用
  if (busyRows[m.rowIndex]) {
    box.querySelectorAll('button[data-act]').forEach(btn => { if (btn.dataset.act !== 'note') btn.disabled = true; });
    box.querySelector('.action-btns').insertAdjacentHTML('afterend', '<div class="busy-note">這位社員有一筆工作處理中，完成後按鈕會自動解鎖（進度看下方工作列）。</div>');
  }
  box.querySelectorAll('button[data-act]').forEach(btn => {
    btn.addEventListener('click', () => handleAction(btn.dataset.act, m, box));
  });
}

async function handleAction(act, m, box) {
  const slot = box.querySelector('.panel-slot');

  // v2.6：會動到金流／簽到的動作一律丟到背景工作列，按完卡片就收起，可以馬上處理下一位
  if (act === 'pay' || act === 'payAdd') {
    startPayTask(m, act === 'payAdd');
    collapseCard();
  }

  if (act === 'series') {
    await doSeries(m, slot);
  }

  if (act === 'alumni') {
    await doAlumni(m, slot);
  }

  if (act === 'attend') {
    // 未繳費就補簽到：只記出席、不記收款，先讓幹部確認
    if (m.fee > 0 && !confirm(`${m.name} 還有 ${formatMoney(m.fee)} 未繳。\n補簽到只記出席、不會記收款，確定要補簽到嗎？`)) return;
    runTask({
      rowIndex: m.rowIndex, name: m.name, label: '補簽到',
      run: () => callAPI('markAttendance', { staffPassword, rowIndex: m.rowIndex }),
      onOk: (r) => {
        patchMember(m.rowIndex, { attended: true });
        return escapeHtml(r.message) + (r.receiptCode ? `<br>前幹部 $0 收據密碼 <b class="t-code">${escapeHtml(r.receiptCode)}</b>` : '');
      }
    });
    collapseCard();
  }

  if (act === 'unattend') {
    // 取消簽到：只刪出席紀錄，已收的款項與收據不受影響
    if (!confirm(`確定要取消 ${m.name} 今日的簽到嗎？\n（繳費紀錄與收據不會被刪除）`)) return;
    runTask({
      rowIndex: m.rowIndex, name: m.name, label: '取消簽到',
      run: () => callAPI('markAttendance', { staffPassword, rowIndex: m.rowIndex, remove: true }),
      onOk: (r) => { patchMember(m.rowIndex, { attended: false }); return escapeHtml(r.message); }
    });
    collapseCard();
  }

  if (act === 'change') {
    slot.innerHTML = `
      <div class="inline-panel">
        <label>身份</label>
        <select class="chg-identity">
          <option value="student" ${m.identity === 'student' ? 'selected' : ''}>學生</option>
          <option value="public" ${m.identity === 'public' ? 'selected' : ''}>社會人士</option>
          ${m.identity === 'alumni' ? '<option value="alumni" selected>前幹部（全部免費）</option>' : ''}
        </select>
        ${m.identity === 'alumni' ? '<div class="detail" style="font-size:12px;">改回學生／社會人士即取消前幹部身份（之後恢復收費；已退的款項不會自動補收）。</div>' : '<div class="detail" style="font-size:12px;">要改成前幹部請用「登記前幹部」按鈕（可同時處理退費）。</div>'}
        <label>方案</label>
        <select class="chg-type">
          <option value="single" ${m.memberType === 'single' ? 'selected' : ''}>單堂社員</option>
          <option value="semester" ${m.memberType === 'semester' ? 'selected' : ''}>學期社員</option>
        </select>
        <button class="btn chg-go">套用變更</button>
      </div>`;
    slot.querySelector('.chg-go').addEventListener('click', () => {
      const identity = slot.querySelector('.chg-identity').value;
      const memberType = slot.querySelector('.chg-type').value;
      runTask({
        rowIndex: m.rowIndex, name: m.name, label: '變更身份／方案',
        run: () => callAPI('updateMember', { staffPassword, rowIndex: m.rowIndex, identity, memberType }),
        onOk: (r) => {
          let msg = `已更新：${typeLabel(r.member)}，`;
          msg += (r.fee == null) ? '費用於社課當日計算' : `今日應繳 ${formatMoney(r.fee)}`;
          if (r.credit > 0) msg += `（已折抵 ${formatMoney(r.credit)}）`;
          if (r.refundHint) msg += '。' + r.refundHint;
          return escapeHtml(msg);
        }
      });
      collapseCard();
    });
  }

  if (act === 'note') {
    slot.innerHTML = `
      <div class="inline-panel">
        <label>備注（會寫入 Google Sheets，跟著這位社員）</label>
        <textarea class="note-text" rows="2" placeholder="例：已私下轉帳、下次補收據…"></textarea>
        <button class="btn note-go">儲存備注</button>
      </div>`;
    slot.querySelector('.note-go').addEventListener('click', () => {
      const note = slot.querySelector('.note-text').value.trim();
      if (!note) return;
      runTask({
        rowIndex: m.rowIndex, name: m.name, label: '備注', money: false,
        run: () => callAPI('addNote', { staffPassword, scope: 'member', rowIndex: m.rowIndex, note }),
        onOk: () => '備注已儲存：' + escapeHtml(note)
      });
      collapseCard();
    });
  }
}

// 收款（名單列「收款」「加收今天＋收款」與現場報名共用）
function startPayTask(m, addToday) {
  runTask({
    rowIndex: m.rowIndex, name: m.name,
    label: (addToday ? '加收今天＋收款 ' : '收款 ') + formatMoney(m.fee),
    dupHint: /已收過|不可重複/,
    run: async () => {
      if (addToday) await callAPI('updateMember', { staffPassword, rowIndex: m.rowIndex, addToday: true });
      return callAPI('confirm', { staffPassword, rowIndex: m.rowIndex });
    },
    onOk: (r, t) => {
      patchMember(m.rowIndex, { fee: 0, attended: true, relevant: true });
      t.noteCode = r.code; // 可在工作列補這筆收款的備注
      return `已收 ${formatMoney(r.fee)}・${escapeHtml(r.receiptItem)}<br>收據密碼 <b class="t-code">${escapeHtml(r.code)}</b>（社員頁面會自動跳出，網路不順時才需口頭告知）`;
    }
  });
}

// ===== v2.6 背景工作列：按下收款／簽到後不必等轉圈，可以馬上處理下一位 =====
// 每個動作是一筆獨立工作，顯示在畫面底部的工作列（處理中 / 完成 / 失敗＋重試），
// 不再綁在社員卡片上 → 點別人、收起卡片、切分頁都不會讓結果消失。
const tasks = [];              // 最新在前
const busyRows = {};           // rowIndex → 進行中的工作數（同一人處理中時鎖住金流按鈕，防重複收款）
let taskSeq = 0;
let trayOpen = false;
let refreshTimer = null;

function runningCount() { return tasks.filter(t => t.status === 'run').length; }

function runTask(opt) {
  const t = {
    id: ++taskSeq, rowIndex: opt.rowIndex, name: opt.name, label: opt.label,
    status: 'run', detail: '', time: new Date(), opt: opt
  };
  tasks.unshift(t);
  // 只保留最近 30 筆（進行中的一定保留）
  for (let i = tasks.length - 1; i >= 0 && tasks.length > 30; i--) {
    if (tasks[i].status !== 'run') tasks.splice(i, 1);
  }
  execTask(t);
  toast(`已送出：${opt.name} ${opt.label}`);
  return t;
}

async function execTask(t) {
  const opt = t.opt;
  t.status = 'run'; t.detail = ''; t.alert = false;
  busyRows[t.rowIndex] = (busyRows[t.rowIndex] || 0) + 1;
  renderTray(); rerenderKeepPanel();
  try {
    const r = await opt.run();
    t.status = 'ok';
    t.detail = opt.onOk ? (opt.onOk(r, t) || '') : '';
  } catch (err) {
    const msg = String(err && err.message || err);
    if (opt.dupHint && opt.dupHint.test(msg)) {
      // 網路重送造成的「已收過」：錢其實已經記上了，不算失敗
      t.status = 'warn';
      t.detail = escapeHtml(msg) + '<br>多半是網路重送造成，系統裡已有這筆收款；請看名單狀態確認，不要再收一次。';
    } else {
      t.status = 'err';
      t.detail = escapeHtml(msg);
    }
    t.alert = true;
  } finally {
    busyRows[t.rowIndex] = Math.max(0, (busyRows[t.rowIndex] || 1) - 1);
    if (t.alert) trayOpen = true;   // 失敗或需要退現金 → 自動展開提醒
    renderTray(); rerenderKeepPanel();
    scheduleRefresh();
  }
}

// 全部工作結束後再整批刷新名單一次（避免每筆都重抓、也避免刷新時打斷操作）
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    if (runningCount() > 0) return; // 還有工作在跑，等最後一筆結束再刷
    try { await refreshRoster(); } catch (e) {}
  }, 700);
}

// 成功後先在本地更新那一列（不用等名單重抓就看得到「已簽到」）
function patchMember(rowIndex, fields) {
  if (!rosterData) return;
  const m = rosterData.members.find(x => x.rowIndex === rowIndex);
  if (m) Object.assign(m, fields);
}

function collapseCard() {
  expandedRow = null;
  renderMemberList();
}

// 重畫名單但保留目前展開卡片裡的面板（正在打字的備注、勾選中的堂次都不會被清掉）
function rerenderKeepPanel() {
  if (!rosterData) return;
  const keep = expandedRow;
  const oldBox = keep ? $('actions-' + keep) : null;
  const oldSlot = oldBox ? oldBox.querySelector('.panel-slot') : null;
  renderMemberList();
  if (oldSlot) {
    const newBox = $('actions-' + keep);
    const newSlot = newBox && newBox.querySelector('.panel-slot');
    if (newSlot) newSlot.replaceWith(oldSlot);
  }
}

function taskIcon(st) {
  if (st === 'run') return '<span class="mini-spin"></span>';
  if (st === 'ok') return '<span class="t-ic ok">✓</span>';
  if (st === 'warn') return '<span class="t-ic warn">!</span>';
  return '<span class="t-ic err">✕</span>';
}

function renderTray() {
  const tray = $('tray');
  if (!tasks.length) { tray.style.display = 'none'; document.body.classList.remove('has-tray'); return; }
  tray.style.display = 'block';
  document.body.classList.add('has-tray');
  const run = runningCount();
  const ok = tasks.filter(t => t.status === 'ok').length;
  const bad = tasks.filter(t => t.status === 'err' || t.status === 'warn').length;

  let head = `<div class="tray-head" data-op="toggle">
    <span class="tray-title">${run ? '<span class="mini-spin"></span>處理中 ' + run : '工作列'}</span>
    <span class="tray-counts">${ok ? `<span class="c-ok">✓ ${ok}</span>` : ''}${bad ? `<span class="c-err">✕ ${bad}</span>` : ''}</span>
    <span class="tray-arrow">${trayOpen ? '收起 ▾' : '展開 ▴'}</span>
  </div>`;
  // 收起時顯示最新一筆的一行摘要
  if (!trayOpen) {
    const t = tasks[0];
    head += `<div class="tray-peek st-${t.status}">${taskIcon(t.status)}<b>${escapeHtml(t.name)}</b> ${escapeHtml(t.label)}</div>`;
    tray.innerHTML = head;
    return;
  }
  let body = '<div class="tray-body">';
  tasks.forEach(t => {
    body += `<div class="task st-${t.status}" data-id="${t.id}">
      <div class="t-head">${taskIcon(t.status)}<span class="t-main"><b>${escapeHtml(t.name)}</b> ${escapeHtml(t.label)}</span><span class="t-time">${fmtTime(t.time)}</span></div>
      ${t.status === 'run' ? '<div class="t-detail">處理中…可以先處理下一位</div>' : (t.detail ? `<div class="t-detail">${t.detail}</div>` : '')}
      <div class="t-actions">
        ${t.status === 'err' ? '<button class="t-btn" data-op="retry">重試</button>' : ''}
        ${t.status === 'ok' && t.noteCode && !t.noteSaved ? '<button class="t-btn" data-op="note">加這筆收款備注</button>' : ''}
        ${t.noteSaved ? '<span class="t-saved">備注已存</span>' : ''}
        ${t.status !== 'run' ? '<button class="t-btn ghost" data-op="dismiss">移除</button>' : ''}
      </div>
      ${t.noteOpen ? `<div class="t-note"><input type="text" class="t-note-in" placeholder="例：找零 $50、朋友代付…"><button class="t-btn" data-op="saveNote">儲存</button></div>` : ''}
    </div>`;
  });
  body += '</div>';
  const doneCount = tasks.filter(t => t.status !== 'run').length;
  if (doneCount) body += '<div class="tray-foot"><button class="t-btn ghost" data-op="clear">清除已完成</button></div>';
  // 保留正在輸入的收款備注
  const typing = {};
  tray.querySelectorAll('.task').forEach(el => {
    const inp = el.querySelector('.t-note-in');
    if (inp) typing[el.dataset.id] = inp.value;
  });
  tray.innerHTML = head + body;
  Object.keys(typing).forEach(id => {
    const inp = tray.querySelector(`.task[data-id="${id}"] .t-note-in`);
    if (inp) inp.value = typing[id];
  });
}

$('tray').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-op]');
  if (!el) return;
  const op = el.dataset.op;
  if (op === 'toggle') { trayOpen = !trayOpen; renderTray(); return; }
  if (op === 'clear') {
    for (let i = tasks.length - 1; i >= 0; i--) if (tasks[i].status !== 'run') tasks.splice(i, 1);
    if (!tasks.length) trayOpen = false;
    renderTray(); return;
  }
  const box = e.target.closest('.task');
  const t = box && tasks.find(x => x.id === Number(box.dataset.id));
  if (!t) return;
  if (op === 'retry') { execTask(t); return; }
  if (op === 'dismiss') { tasks.splice(tasks.indexOf(t), 1); if (!tasks.length) trayOpen = false; renderTray(); return; }
  if (op === 'note') { t.noteOpen = true; renderTray(); const i = $('tray').querySelector(`.task[data-id="${t.id}"] .t-note-in`); if (i) i.focus(); return; }
  if (op === 'saveNote') {
    const inp = box.querySelector('.t-note-in');
    const note = inp ? inp.value.trim() : '';
    if (!note) return;
    el.disabled = true;
    try {
      await callAPI('addNote', { staffPassword, scope: 'record', code: t.noteCode, note });
      t.noteOpen = false; t.noteSaved = true;
    } catch (err) { toast(err.message, true); }
    renderTray();
  }
});

// ===== v2.5 登記前幹部（含本學期已繳款項退費）=====
async function doAlumni(m, slot) {
  slot.innerHTML = '<div class="loading"><div class="spinner"></div>查詢本學期繳費紀錄...</div>';
  let q;
  try {
    q = await callAPI('alumniQuote', { staffPassword, rowIndex: m.rowIndex });
  } catch (err) {
    slot.innerHTML = `<div class="detail" style="color:var(--err); margin-top:8px;">${escapeHtml(err.message)}</div>`;
    return;
  }
  let html = `<div class="inline-panel">
    <div style="font-weight:600; margin-bottom:4px;">登記 ${escapeHtml(m.name)} 為前幹部</div>
    <div class="detail" style="font-size:13px; margin-bottom:8px;">登記後所有社課（單堂、學期、系列）全部免費，每次出席自動開一張 $0 收據。</div>`;
  if (q.refundable.length) {
    html += `<div class="detail" style="font-size:13px; margin-bottom:4px;">${escapeHtml(q.semester)} 學期已繳款項，勾選要退費的（會記一筆負數退費，金流報表自動扣除）：</div>`;
    q.refundable.forEach(x => {
      html += `<label class="sess-row" style="text-transform:none; letter-spacing:0; margin:0;">
        <input type="checkbox" class="rf-chk" value="${escapeHtml(x.code)}" data-fee="${Number(x.fee)}" checked>
        <div class="s-main">${escapeHtml(x.item)}<div class="s-sub">${escapeHtml(x.courseDate)}${x.future ? ' ・ 預繳未上' : ''} ・ 收據 ${escapeHtml(x.code)}</div></div>
        <div class="s-sub">${formatMoney(x.fee)}</div>
      </label>`;
    });
  } else {
    html += '<div class="detail" style="font-size:13px;">本學期沒有已繳款項，不需退費。</div>';
  }
  html += `<button class="btn rf-go" style="background:#a3471b;"></button>
    <div class="detail rf-msg" style="margin-top:8px;"></div>
  </div>`;
  slot.innerHTML = html;

  const go = slot.querySelector('.rf-go');
  const picked = () => Array.from(slot.querySelectorAll('.rf-chk:checked'));
  const sync = () => {
    const total = picked().reduce((a, c) => a + Number(c.dataset.fee || 0), 0);
    go.textContent = total ? `確認登記前幹部，並退費 ${formatMoney(total)}` : '確認登記前幹部（不退費）';
  };
  slot.querySelectorAll('.rf-chk').forEach(c => c.addEventListener('change', sync));
  sync();

  go.addEventListener('click', () => {
    const codes = picked().map(c => c.value);
    const total = picked().reduce((a, c) => a + Number(c.dataset.fee || 0), 0);
    if (!confirm(`確定登記 ${m.name} 為前幹部？` + (total ? `\n會記一筆退費 ${formatMoney(total)}，請現場退還現金。` : ''))) return;
    runTask({
      rowIndex: m.rowIndex, name: m.name,
      label: '登記前幹部' + (total ? '＋退費 ' + formatMoney(total) : ''),
      run: () => callAPI('setAlumni', { staffPassword, rowIndex: m.rowIndex, refundCodes: codes }),
      onOk: (r, t) => {
        patchMember(m.rowIndex, { identity: 'alumni', fee: 0 });
        const refund = (r.refundTotal || 0) + (r.alreadyRefundedTotal || 0);
        if (refund) t.alert = true; // 要退現金 → 工作列自動展開提醒
        return escapeHtml(m.name) + ' 已登記為前幹部'
          + (refund ? `<div class="t-refund">請退還現金 ${formatMoney(refund)}</div>` : '')
          + (r.receiptCode ? `今天這堂已補開 $0 收據，密碼 <b class="t-code">${escapeHtml(r.receiptCode)}</b>` : '');
      }
    });
    collapseCard();
  });
}

// ===== v2.4 系列多堂一次繳（名單列與現場報名共用）=====
async function doSeries(m, slot, afterDone) {
  slot.innerHTML = '<div class="loading"><div class="spinner"></div>讀取系列堂次...</div>';
  let q;
  try {
    q = await callAPI('seriesQuote', { staffPassword, rowIndex: m.rowIndex });
  } catch (err) {
    slot.innerHTML = `<div class="detail" style="color:var(--err); margin-top:8px;">${escapeHtml(err.message)}</div>`;
    return;
  }
  const info = q.info;
  if (info.payableCount === 0) {
    slot.innerHTML = `<div class="detail" style="color:var(--ok); margin-top:8px;">「${escapeHtml(info.series)}」所有堂次都已繳清（或已結束）。</div>`;
    return;
  }

  let html = `<div class="inline-panel">
    <div style="font-weight:600; margin-bottom:4px;">${escapeHtml(info.series)}（共 ${info.count} 堂）</div>
    <div class="detail" style="font-size:13px; margin-bottom:6px;">每堂 ${formatMoney(info.perFee)}（${idLabel(q.member.identity)}單堂價），勾選要一起繳的堂次：</div>`;
  info.sessions.forEach(s => {
    const status = s.paid ? '已繳' : (s.past ? '已結束' : (s.isToday ? '今天' : ''));
    html += `<label class="sess-row ${s.payable ? '' : 'disabled'}" style="text-transform:none; letter-spacing:0; margin:0;">
      <input type="checkbox" class="sess-chk" value="${escapeHtml(s.key)}" ${s.payable ? 'checked' : 'disabled'}>
      <div class="s-main">第 ${s.index} 堂 ・ ${escapeHtml(s.key)}<div class="s-sub">${escapeHtml(s.name || '')}</div></div>
      <div class="s-sub">${status ? escapeHtml(status) + ' ・ ' : ''}${formatMoney(info.perFee)}</div>
    </label>`;
  });
  html += `<label style="margin-top:10px;">備注（選填）</label>
    <textarea class="sess-note" rows="2" placeholder="例：找零 $50、朋友代付…"></textarea>
    <button class="btn sess-go"></button>
    <div class="detail sess-msg" style="margin-top:8px;"></div>
  </div>`;
  slot.innerHTML = html;

  const go = slot.querySelector('.sess-go');
  const picked = () => Array.from(slot.querySelectorAll('.sess-chk:checked')).map(x => x.value);
  const refreshBtn = () => {
    const n = picked().length;
    go.textContent = n ? `確認已收現金 ${formatMoney(n * info.perFee)}（${n} 堂）` : '請至少勾選一堂';
    go.disabled = n === 0;
  };
  slot.querySelectorAll('.sess-chk').forEach(c => c.addEventListener('change', refreshBtn));
  refreshBtn();

  go.addEventListener('click', () => {
    const dates = picked();
    if (!dates.length) return;
    const total = dates.length * info.perFee;
    if (!confirm(`確認已向 ${m.name} 收取 ${formatMoney(total)}（${dates.length} 堂）？`)) return;
    const note = slot.querySelector('.sess-note').value.trim();
    runTask({
      rowIndex: m.rowIndex, name: m.name,
      label: `系列收款 ${formatMoney(total)}（${dates.length} 堂）`,
      dupHint: /已繳過|不可重複/,
      run: () => callAPI('confirmSeries', { staffPassword, rowIndex: m.rowIndex, dates, note }),
      onOk: (r) => {
        if (r.checkedInToday) patchMember(m.rowIndex, { fee: 0, attended: true, relevant: true });
        return `共收 ${formatMoney(r.total)}（${r.receipts.length} 堂）${r.checkedInToday ? '・今日已簽到' : '・今天未含在內，未自動簽到'}<div class="t-codes">`
          + r.receipts.map(x => `<span>第${x.index}堂 ${escapeHtml(x.key)} <b class="t-code">${escapeHtml(x.code)}</b></span>`).join('')
          + '</div>社員頁面會自動跳出全部收據。';
      }
    });
    if (afterDone) afterDone(); else collapseCard();
  });
}

// ===== 現場報名 =====
$('btnWalkin').addEventListener('click', async () => {
  const name = $('wName').value.trim();
  const phone = $('wPhone').value.replace(/\D/g, '');
  if (!name || phone.length < 9) { toast('請輸入姓名與完整電話', true); return; }
  $('btnWalkin').disabled = true;
  try {
    const r = await callAPI('walkin', {
      staffPassword, name, phone,
      identity: $('wIdentity').value, memberType: $('wMemberType').value
    });
    const m = r.member;
    const feeBlock = (r.fee == null)
      ? '<div style="font-size:15px; color:var(--muted); text-align:center; margin:14px 0;">今日無社課，僅建立報名資料（費用於社課當日計算）</div>'
      : `<div style="font-size:30px; font-weight:600; text-align:center; margin:14px 0;">${formatMoney(r.fee)}</div>`;
    let html = `
      <div class="card">
        <div class="status ok"><span>✓</span>已建立／更新報名</div>
        <div class="detail"><b>${escapeHtml(m.name)}</b>（${idLabel(m.identity)}・${m.memberType === 'semester' ? '學期' : '單堂'}）${r.receiptItem ? '<br>品名：' + escapeHtml(r.receiptItem) : ''}</div>
        ${feeBlock}
        <div class="panel-slot"></div>
      </div>`;
    $('walkinResult').innerHTML = html;
    const slot = $('walkinResult').querySelector('.panel-slot');
    if (r.fee > 0) {
      const canSeries = r.course && r.course.series && m.memberType === 'single';
      slot.innerHTML = `<button class="btn" id="btnWalkinPay">確認已收現金 ${formatMoney(r.fee)}（只繳今天）</button>`
        + (canSeries ? `<button class="btn secondary" id="btnWalkinSeries" style="border-color:#0f6e56; color:#0f6e56;">系列「${escapeHtml(r.course.series)}」多堂一次繳</button>` : '');
      // v2.6：送出收款後立刻清空表單，可以接著幫下一位現場報名
      const walkinDone = () => {
        $('wName').value = ''; $('wPhone').value = '';
        $('walkinResult').innerHTML = '<div class="detail" style="text-align:center; padding:8px 0;">已送出，處理進度請看下方工作列。可以接著報名下一位。</div>';
        $('wName').focus();
      };
      $('btnWalkinPay').addEventListener('click', () => {
        startPayTask({ rowIndex: m.rowIndex, name: m.name, fee: r.fee }, false);
        walkinDone();
      });
      if (canSeries) {
        $('btnWalkinSeries').addEventListener('click', async () => {
          await doSeries(m, slot, walkinDone);
        });
      }
    } else if (r.fee == null) {
      // 無課日：僅建檔，不提供收款或簽到
      $('wName').value = ''; $('wPhone').value = '';
      slot.innerHTML = '<div class="detail" style="text-align:center; color:var(--ok);">建檔完成。</div>';
    } else {
      slot.innerHTML = `<button class="btn" id="btnWalkinFree">無需繳費，完成簽到</button>`;
      $('btnWalkinFree').addEventListener('click', () => {
        runTask({
          rowIndex: m.rowIndex, name: m.name, label: '簽到（免繳）',
          run: () => callAPI('markAttendance', { staffPassword, rowIndex: m.rowIndex }),
          onOk: (ar) => escapeHtml(ar.message || '簽到完成') + (ar.receiptCode ? `<br>$0 收據密碼 <b class="t-code">${escapeHtml(ar.receiptCode)}</b>` : '')
        });
        $('wName').value = ''; $('wPhone').value = '';
        $('walkinResult').innerHTML = '<div class="detail" style="text-align:center; padding:8px 0;">已送出，處理進度請看下方工作列。</div>';
      });
    }
  } catch (err) {
    toast(err.message, true);
  } finally {
    $('btnWalkin').disabled = false;
  }
});

// ===== 報表 =====
let reportLoaded = false;
async function loadReport() {
  $('reportContent').innerHTML = '<div class="loading"><div class="spinner"></div>載入中...</div>';
  try {
    const [stats, fin] = await Promise.all([
      callAPI('courseStats', { staffPassword }),
      callAPI('finance', { staffPassword })
    ]);

    // v2.4：今日實收（依收款時間），舊後端沒有此欄位時退回本堂明細
    const collected = fin.collectedToday || { total: fin.today.total, payments: fin.today.payments };
    const prepaidTotal = collected.payments.filter(p => p.prepaid).reduce((a, p) => a + (Number(p.fee) || 0), 0);

    let html = `
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${stats.attendedCount}<span style="font-size:14px;color:var(--muted);">/${stats.expectedCount}</span></div><div class="lbl">已到 / 應到</div></div>
        <div class="stat-box"><div class="num">${formatMoney(stats.todayTotal)}</div><div class="lbl">本堂收入（${stats.paidCount} 筆）</div></div>
      </div>
      <div class="stat-grid">
        <div class="stat-box" style="background:#eaf5f0;"><div class="num" style="color:#0f6e56;">${formatMoney(collected.total)}</div><div class="lbl">今日實收現金（${collected.payments.length} 筆）</div></div>
        <div class="stat-box" style="background:#f0f7ff;"><div class="num" style="color:var(--blue);">${formatMoney(fin.semesterTotal)}</div><div class="lbl">${escapeHtml(fin.semester)} 學期累計</div></div>
      </div>
      ${prepaidTotal > 0 ? `<div class="detail" style="font-size:13px; margin:-4px 0 12px;">今日實收含系列預繳後續堂次 ${formatMoney(prepaidTotal)}；「本堂收入」只計歸屬今天這堂的金額。</div>` : ''}
    `;

    if (stats.unpaid.length > 0) {
      html += `<h3 class="sec">尚未繳費（${stats.unpaid.length} 人）</h3><div class="card mini-list">`;
      stats.unpaid.forEach(u => {
        html += `<div class="mini-item"><span>${escapeHtml(u.name)}（${u.memberType === 'semester' ? '學期' : '單堂'}・${idLabel(u.identity, true)}）</span><span class="r">${formatMoney(u.fee)}</span></div>`;
      });
      html += '</div>';
    }

    if (collected.payments.length > 0) {
      html += `<h3 class="sec">今日收款明細</h3><div class="card mini-list">`;
      collected.payments.forEach(p => {
        html += `<div class="mini-item"><span>${fmtTime(p.time)} ${escapeHtml(p.name)}${p.prepaid ? ' <span class="badge series">預繳 ' + escapeHtml(p.courseDate) + '</span>' : ''}${p.refund ? ' <span class="badge refund">退費</span>' : ''}${p.note ? '（注：' + escapeHtml(p.note) + '）' : ''}<br><span style="font-size:12px;color:var(--muted);">${escapeHtml(p.item)}</span></span><span class="r">${formatMoney(p.fee)}</span></div>`;
      });
      html += '</div>';
    }

    if (fin.byItem.length > 0) {
      html += `<h3 class="sec">本學期收入（分品名）</h3><div class="card mini-list">`;
      fin.byItem.forEach(it => {
        html += `<div class="mini-item"><span>${escapeHtml(it.item)}</span><span class="r">${it.count} 筆 ・ ${formatMoney(it.total)}</span></div>`;
      });
      html += '</div>';
    }

    // v2.3：各堂金流板塊（每堂課的入帳筆數與金額，最新在前）
    if (fin.byCourse && fin.byCourse.length > 0) {
      html += `<h3 class="sec">本學期各堂金流</h3><div class="card mini-list">`;
      fin.byCourse.forEach(c => {
        html += `<div class="mini-item"><span>${escapeHtml(c.courseName || '（未命名課程）')}<br><span style="font-size:12px;color:var(--muted);">${escapeHtml(c.date)}</span></span><span class="r">${c.count} 筆 ・ ${formatMoney(c.total)}</span></div>`;
      });
      html += '</div>';
    }

    html += `<h3 class="sec">今日出席（${stats.attendedCount} 人）</h3><div class="card mini-list">`;
    if (stats.attended.length === 0) {
      html += '<div class="detail">尚無出席紀錄。</div>';
    } else {
      stats.attended.forEach(a => {
        html += `<div class="mini-item"><span>${escapeHtml(a.name)}</span><span class="r">${fmtTime(a.time)}</span></div>`;
      });
    }
    html += '</div>';

    $('reportContent').innerHTML = html;
    reportLoaded = true;
  } catch (err) {
    $('reportContent').innerHTML = `<div class="card"><div class="status err"><span>✕</span>${escapeHtml(err.message)}</div></div>`;
  }
}

      });
      html += `</div>
        <div class="sx-legend">
          <span><span class="sx-cell paid">✓</span>已繳</span>
          <span><span class="sx-cell enrolled">報</span>報名未繳</span>
          <span><span class="sx-cell none att">·</span>藍底線＝已出席</span>
          <span><span class="badge series">套</span>系列一次繳</span>
        </div>`;
      if (s.members.length === 0) {
        html += '<div class="detail">目前沒有單堂社員報名這個系列。</div>';
      } else {
        html += `<table class="sx-table"><thead><tr><th>姓名</th>${s.sessions.map(x => `<th>${x.index}<br><span style="font-size:11px;">${escapeHtml(x.key)}</span></th>`).join('')}</tr></thead><tbody>`;
        s.members.forEach(m => {
          html += `<tr><td>${escapeHtml(m.name)}${m.identity === 'alumni' ? ' <span class="badge alumni">前幹部</span>' : ''}${m.bundle ? ' <span class="badge series">套</span>' : ''}<div style="font-size:11px;color:var(--muted);">${escapeHtml(m.phoneLast4)} ・ ${m.paidCount}/${s.sessions.length} 堂已繳</div></td>`;
          m.cells.forEach(c => {
            const cls = c.paid ? 'paid' : (c.enrolled ? 'enrolled' : 'none');
            const txt = c.paid ? '✓' : (c.enrolled ? '報' : '·');
            html += `<td><span class="sx-cell ${cls} ${c.attended ? 'att' : ''}">${txt}</span></td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
      }
      html += '</div>';
    });
    $('seriesContent').innerHTML = html;
  } catch (err) {
    $('seriesContent').innerHTML = `<div class="card"><div class="status err"><span>✕</span>${escapeHtml(err.message)}</div></div>`;
  }
}
